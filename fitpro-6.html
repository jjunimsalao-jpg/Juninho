<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FitPro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#0a0a10;color:#fff;min-height:100vh}
.app{max-width:430px;margin:0 auto;min-height:100vh}
button{cursor:pointer;font-family:sans-serif}
input,textarea,select{font-family:sans-serif}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px">
    <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-size:32px">⚡</div>
    <div style="font-size:24px;font-weight:900">FitPro</div>
    <div style="width:36px;height:36px;border:3px solid #2d3548;border-top-color:#3B82F6;border-radius:50%;animation:spin 1s linear infinite"></div>
  </div>
</div>

<style>
@keyframes spin{to{transform:rotate(360deg)}}
:root{--ac:#3B82F6;--bg:#0f1117;--card:#1a1f2e;--bd:#2d3548;--gr:#10B981;--rd:#EF4444;--yw:#F59E0B}
body{background:#0f1117}
.screen{min-height:100vh;background:#0f1117;padding-bottom:80px}
.card{background:#1a1f2e;border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;color:#fff;margin-bottom:10px;font-family:sans-serif}
.inp{width:100%;background:#0f1117;border:1.5px solid var(--bd);border-radius:12px;padding:12px 16px;color:#fff;font-size:14px;outline:none;font-family:sans-serif;margin-bottom:12px}
.inp:focus{border-color:var(--ac)}
.lbl{font-size:11px;font-weight:800;color:#8899aa;letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:6px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#1a1f2e;border-top:2px solid #2d3548;display:flex;padding:8px 0 20px;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;font-size:10px;font-weight:700;font-family:sans-serif;padding:6px 0;color:#667788}
.hdr{padding:52px 20px 16px;background:#1a1f2e;border-bottom:2px solid #2d3548;display:flex;align-items:center;gap:14px}
.back{width:36px;height:36px;border-radius:10px;background:#2d3548;border:none;cursor:pointer;color:#fff;font-size:20px;flex-shrink:0}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block}
.bar{height:5px;border-radius:99px;background:#2d3548;overflow:hidden;margin-top:6px}
.barfill{height:100%;border-radius:99px;transition:width .5s}
.chip{padding:7px 14px;border-radius:20px;border:1.5px solid #2d3548;background:#1a1f2e;color:#8899aa;font-size:13px;font-weight:700;cursor:pointer;font-family:sans-serif;margin:4px}
.chip.on{border-color:var(--ac);background:rgba(59,130,246,.2);color:#60a5fa}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.mbox{background:#1a1f2e;border-radius:20px;padding:24px;border:1px solid #2d3548;width:100%;max-width:390px;max-height:90vh;overflow-y:auto}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--gr);color:#fff;padding:12px 24px;border-radius:30px;font-weight:700;font-size:14px;z-index:9999;white-space:nowrap}
</style>

<script>

// ── DADOS ──
const CORES = ["#3B82F6","#10B981","#8B5CF6","#EC4899","#F97316","#06B6D4","#EF4444","#F59E0B","#84CC16","#D946EF"];
const GRUPOS = {

  "Trapézio":["Encolhimento com Barra","Encolhimento com Halteres","Encolhimento no Smith","Remada Alta com Barra","Remada Alta com Halteres","Power Clean","Facepull com Corda","Upright Row","Elevação Lateral Parcial","Farmer Walk","Encolhimento no Cabo","Snatch Parcial","Trap Bar Shrug","Encolhimento Atrás"],
  "Abdômen":["Crunch Clássico","Crunch no Cabo","Abdominal na Máquina","Elevação de Pernas","Elevação de Joelhos","Prancha Frontal","Prancha Lateral","Russian Twist","Dead Bug","Bird Dog","Bicicleta","Rollout (Roda)","Hollow Hold","Mountain Climber","Sit Up Completo","Decline Crunch","Oblíquo com Cabo","Leg Raise Suspenso","Ab Wheel","V Sit","Dragon Flag","Pallof Press","Crunch Invertido","Abdominal Infra"],
  "Glúteos":["Hip Thrust com Barra","Hip Thrust com Halter","Glúteo na Máquina","Afundo Glúteo","Elevação Pélvica","Stiff com Foco em Glúteo","Agachamento Sumô","Agachamento Búlgaro","Abdução com Elástico","Coice Glúteo no Cabo","Clamshell","Step Up Glúteo","Romanian Deadlift","Donkey Kick","Fire Hydrant","Glúteo 45°","Agachamento Lateral","Coice com Elástico"],
  "Cardio":["Esteira (Corrida)","Esteira (Caminhada)","Esteira (Inclinação)","Bike Ergométrica","Bike Spinning","Elíptico","Remo Ergométrico","Escada (StepMill)","Corda Naval","Pular Corda","Burpee","Jumping Jack","Sprint","HIIT na Esteira","Natação","Circuito Funcional","Jump Squat","Box Jump","Kettlebell Swing","Sled Push","Air Bike","Corrida ao Ar Livre","Protocolo Tabata","Corrida Estacionária"]
};
const ICONS = {"Peito":"🫁","Costas":"🦾","Pernas":"🦵","Panturrilha":"🦴","Ombros":"💠","Bíceps":"💪","Tríceps":"🔱","Trapézio":"🔺","Abdômen":"⭕","Glúteos":"🍑","Cardio":"❤️‍🔥"};
const GCOLOR = {"Peito":"#3B82F6","Costas":"#8B5CF6","Pernas":"#10B981","Panturrilha":"#F59E0B","Ombros":"#EC4899","Bíceps":"#06B6D4","Tríceps":"#F97316","Trapézio":"#84CC16","Abdômen":"#EF4444","Glúteos":"#D946EF","Cardio":"#EF4444"};

// ── STATE ──
let S = {
  tela: "login", role: null, studentId: null,
  alunos: [], alunoAtual: null, tabPerfil: "treinos",
  config: {name:"FitPro", color:"#3B82F6", pass:"1234"},
  notas: "", wb: null, treino: null, tabAluno: "home",
  aiMsgs: [], aiPage: 0
};

// ── TOAST ──
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── FIREBASE HELPERS ──
async function salvarAluno(a) { await db.collection("fitpro_alunos").doc(a.id).set(a); }
async function carregarAlunos() { const s = await db.collection("fitpro_alunos").get(); S.alunos = s.docs.map(d=>d.data()); }
async function apagarAluno(id) { await db.collection("fitpro_alunos").doc(id).delete(); }
async function salvarConfig() { await db.collection("fitpro_cfg").doc("main").set(S.config); }
async function carregarConfig() { const d = await db.collection("fitpro_cfg").doc("main").get(); if(d.exists) S.config = {...S.config, ...d.data()}; }
async function salvarNotas(t) { await db.collection("fitpro_cfg").doc("notas").set({txt:t}); }
async function carregarNotas() { const d = await db.collection("fitpro_cfg").doc("notas").get(); if(d.exists) S.notas = d.data().txt||""; }

// ── RENDER ──
function r() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const t = S.tela;
  if (t==="login") app.appendChild(telaLogin());
  else if (t==="dash") app.appendChild(telaDash());
  else if (t==="alunos") app.appendChild(telaAlunos());
  else if (t==="perfil") app.appendChild(telaPerfil());
  else if (t==="novoAluno") app.appendChild(telaFormAluno(null));
  else if (t==="editAluno") app.appendChild(telaFormAluno(S.alunoAtual));
  else if (t==="wb") app.appendChild(telaWB());
  else if (t==="treino") app.appendChild(telaTreino());
  else if (t==="ai") app.appendChild(telaAI());
  else if (t==="exercicios") app.appendChild(telaExercicios());
  else if (t==="config") app.appendChild(telaConfig());
  else if (t==="alunoHome") app.appendChild(telaAlunoHome());
  window.scrollTo(0,0);
}

function ir(tela) { S.tela = tela; r(); }
function ac() { return S.config.color || "#3B82F6"; }

function navBar(ativa) {
  const itens = [
    {id:"dash",i:"🏠",l:"Início"},
    {id:"alunos",i:"👥",l:"Alunos"},
    {id:"ai",i:"🤖",l:"IA"},
    {id:"exercicios",i:"📚",l:"Exerc."},
    {id:"config",i:"⚙️",l:"Config"},
  ];
  const nav = document.createElement("div");
  nav.className = "nav";
  itens.forEach(it => {
    const b = document.createElement("button");
    b.className = "nb";
    b.style.color = ativa===it.id ? ac() : "#555";
    b.innerHTML = `<span style="font-size:20px">${it.i}</span><span>${it.l}</span>${ativa===it.id?`<div style="width:4px;height:4px;border-radius:50%;background:${ac()}"></div>`:""}`;
    b.onclick = () => ir(it.id);
    nav.appendChild(b);
  });
  return nav;
}

function hdr(titulo, sub, voltar) {
  const d = document.createElement("div");
  d.className = "hdr";
  const btn = document.createElement("button");
  btn.className = "back"; btn.textContent = "‹"; btn.onclick = voltar;
  const txt = document.createElement("div");
  txt.innerHTML = `<div style="font-weight:900;color:#fff;font-size:18px">${titulo}</div>${sub?`<div style="font-size:12px;color:#8899aa;margin-top:2px">${sub}</div>`:""}`;
  d.appendChild(btn); d.appendChild(txt);
  return d;
}

function avatar(a, sz=48) {
  const d = document.createElement("div");
  const ini = (a.nome||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  d.style.cssText = `width:${sz}px;height:${sz}px;border-radius:${Math.min(sz*.35,18)}px;background:${a.cor||ac()};display:flex;align-items:center;justify-content:center;font-size:${sz*.33}px;font-weight:900;color:#fff;flex-shrink:0;box-shadow:0 4px 14px ${a.cor||ac()}44`;
  d.textContent = ini;
  return d;
}

function barEl(val, max, cor, h=5) {
  const w = document.createElement("div");
  w.className = "bar"; w.style.height = h+"px";
  const f = document.createElement("div");
  f.className = "barfill";
  const pct = Math.min(100, Math.max(0, (val/max)*100));
  f.style.cssText = `width:${pct}%;background:${cor}`;
  w.appendChild(f); return w;
}

// ── LOGIN ──
function telaLogin() {
  const wrap = document.createElement("div");
  wrap.style.cssText = "min-height:100vh;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px";
  wrap.innerHTML = `
    <div style="text-align:center;margin-bottom:40px">
      <div style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,${ac()},${ac()}99);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px;box-shadow:0 8px 32px ${ac()}44">⚡</div>
      <div style="font-size:28px;font-weight:900">${S.config.name||"FitPro"}</div>
      <div style="font-size:13px;color:#8899aa;margin-top:4px">Gestão profissional de treinos</div>
    </div>
    <div style="display:flex;background:#1a1f2e;border-radius:12px;padding:4px;margin-bottom:20px;width:100%;max-width:320px">
      <button id="btnT" onclick="setRole('trainer')" style="flex:1;padding:11px 0;border-radius:10px;border:none;font-weight:700;font-size:14px;font-family:sans-serif;background:${ac()};color:#fff;cursor:pointer">Personal</button>
      <button id="btnA" onclick="setRole('student')" style="flex:1;padding:11px 0;border-radius:10px;border:none;font-weight:700;font-size:14px;font-family:sans-serif;background:transparent;color:#8899aa;cursor:pointer">Aluno</button>
    </div>
    <div style="width:100%;max-width:320px">
      <input id="loginPass" type="password" class="inp" placeholder="Senha do personal..." style="display:block">
      <input id="loginNome" class="inp" placeholder="Digite seu nome..." style="display:none">
      <button onclick="fazerLogin()" style="width:100%;padding:16px;background:linear-gradient(135deg,${ac()},${ac()}bb);border:none;border-radius:14px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;font-family:sans-serif">Entrar como Personal</button>
    </div>
  `;
  window.setRole = function(r) {
    window._role = r;
    document.getElementById("btnT").style.cssText = `flex:1;padding:11px 0;border-radius:10px;border:none;font-weight:700;font-size:14px;font-family:sans-serif;cursor:pointer;background:${r==="trainer"?ac():"transparent"};color:${r==="trainer"?"#fff":"#555"}`;
    document.getElementById("btnA").style.cssText = `flex:1;padding:11px 0;border-radius:10px;border:none;font-weight:700;font-size:14px;font-family:sans-serif;cursor:pointer;background:${r==="student"?ac():"transparent"};color:${r==="student"?"#fff":"#555"}`;
    document.getElementById("loginPass").style.display = r==="trainer"?"block":"none";
    document.getElementById("loginNome").style.display = r==="student"?"block":"none";
    document.querySelector("#app button:last-child").textContent = r==="trainer"?"Entrar como Personal":"Acessar Meus Treinos";
  };
  window._role = "trainer";
  window.fazerLogin = function() {
    if (window._role==="trainer") {
      const p = document.getElementById("loginPass").value;
      if (p !== S.config.pass) { toast("❌ Senha incorreta!"); return; }
      S.role = "trainer"; ir("dash");
    } else {
      const n = document.getElementById("loginNome").value.trim().toLowerCase();
      const a = S.alunos.find(x => x.nome.split(" ")[0].toLowerCase()===n || x.codigo===n);
      if (a) { S.role="student"; S.studentId=a.id; S.tabAluno="home"; ir("alunoHome"); }
      else toast("❌ Aluno não encontrado!");
    }
  };
  return wrap;
}

// ── DASHBOARD ──
function telaDash() {
  const wrap = document.createElement("div");
  wrap.className = "screen";
  wrap.style.paddingTop = "56px";
  const treinaram = S.alunos.filter(a=>a.treinouHoje);
  const naoTreinaram = S.alunos.filter(a=>!a.treinouHoje);
  const avgFreq = S.alunos.length ? Math.round(S.alunos.reduce((s,a)=>s+(a.freq||0),0)/S.alunos.length) : 0;

  let html = `
    <div style="padding:22px 20px 0">
      <div style="font-size:12px;color:#8899aa;margin-bottom:3px">${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div>
      <div style="font-size:24px;font-weight:900"><span style="color:${ac()}">${S.config.name||"FitPro"}</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 0">
      <div class="card" style="text-align:center;margin-bottom:0"><div style="font-size:20px;margin-bottom:6px">👥</div><div style="font-size:22px;font-weight:900;color:${ac()}">${S.alunos.length}</div><div style="font-size:10px;color:#8899aa;font-weight:700">Total</div></div>
      <div class="card" style="text-align:center;margin-bottom:0"><div style="font-size:20px;margin-bottom:6px">✅</div><div style="font-size:22px;font-weight:900;color:#10B981">${treinaram.length}</div><div style="font-size:10px;color:#8899aa;font-weight:700">Treinaram</div></div>
      <div class="card" style="text-align:center;margin-bottom:0"><div style="font-size:20px;margin-bottom:6px">⚠️</div><div style="font-size:22px;font-weight:900;color:${naoTreinaram.length>0?"#EF4444":"#555"}">${naoTreinaram.length}</div><div style="font-size:10px;color:#8899aa;font-weight:700">Sem treino</div></div>
    </div>
    <div style="padding:12px 20px 0">
      <div class="card" style="margin-bottom:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:12px;font-weight:700">Freq. Média</span>
          <span style="font-size:18px;font-weight:900;color:${avgFreq>=80?"#10B981":"#F59E0B"}">${avgFreq}%</span>
        </div>
      </div>
    </div>
  `;

  if (naoTreinaram.length > 0) {
    html += `<div style="margin:12px 20px 0;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:14px;padding:12px 14px"><div style="font-size:12px;font-weight:800;color:#ef4444;margin-bottom:8px">⚠️ Sem treino hoje</div><div id="ntList" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>`;
  }

  html += `<div style="padding:16px 20px 0"><div style="font-size:13px;font-weight:800;margin-bottom:12px">Alunos</div><div id="dashList"></div></div>
  <div style="padding:0 20px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button onclick="ir('ai')" class="card" style="border:1px solid var(--bd);border-radius:16px;cursor:pointer;text-align:left;padding:16px;margin-bottom:0"><div style="font-size:26px;margin-bottom:8px">🤖</div><div style="font-size:13px;font-weight:700">IA Personal</div></button>
      <button onclick="ir('novoAluno')" class="card" style="border:1px solid var(--bd);border-radius:16px;cursor:pointer;text-align:left;padding:16px;margin-bottom:0"><div style="font-size:26px;margin-bottom:8px">➕</div><div style="font-size:13px;font-weight:700">Novo Aluno</div></button>
    </div>
  </div>`;

  wrap.innerHTML = html;

  if (naoTreinaram.length > 0) {
    const ntl = wrap.querySelector("#ntList");
    naoTreinaram.forEach(a => {
      const b = document.createElement("button");
      b.className = "chip on";
      b.style.cssText = `background:${a.cor||ac()}22;border-color:${a.cor||ac()};color:${a.cor||ac()}`;
      b.textContent = a.nome.split(" ")[0];
      b.onclick = () => abrirPerfil(a);
      ntl.appendChild(b);
    });
  }

  const dl = wrap.querySelector("#dashList");

  wrap.appendChild(tabBar);

  const cont = document.createElement("div"); cont.id="tabContent"; cont.style.padding="20px";
  wrap.appendChild(cont);

  function trocarTab(t) {
    tabs.forEach(x => { const b=document.getElementById(`tab_${x}`); if(b){b.style.borderBottom=x===t?`2px solid ${ac()}`:"2px solid transparent";b.style.color=x===t?ac():"#555";} });
    cont.innerHTML="";
    if(t==="treinos") renderTabTreinos(cont);
    else if(t==="perfil") renderTabPerfil(cont);
    else if(t==="medidas") renderTabMedidas(cont);
    else if(t==="evolução") renderTabEvolucao(cont);
    else if(t==="fotos") renderTabFotos(cont);

  window.verQR = () => {
    const m=document.createElement("div"); m.className="modal"; m.onclick=e=>{if(e.target===m)m.remove()};
    const box=document.createElement("div"); box.className="mbox"; box.style.textAlign="center";
    box.innerHTML=`<div style="font-size:16px;font-weight:800;margin-bottom:4px">QR Code</div><div style="font-size:12px;color:#8899aa;margin-bottom:16px">Aluno escaneia para acessar</div><canvas id="qrC" style="border-radius:12px;width:200px;height:200px"></canvas><br><button onclick="this.closest('.modal').remove()" style="margin-top:16px;background:${ac()};color:#fff;border:none;border-radius:12px;padding:11px 32px;font-weight:800;cursor:pointer;font-family:sans-serif;font-size:14px">Fechar</button>`;
    m.appendChild(box); document.body.appendChild(m);
    setTimeout(()=>{
      const c=document.getElementById("qrC"); if(!c) return;
      const ctx=c.getContext("2d"),sz=200; c.width=sz;c.height=sz;
      ctx.fillStyle="#13131c";ctx.fillRect(0,0,sz,sz);
      let seed=0; for(let i=0;i<a.id.length;i++) seed=(seed*31+a.id.charCodeAt(i))&0xFFFFFF;
      function rnd(){seed^=seed<<13;seed^=seed>>17;seed^=seed<<5;return(seed>>>0)/0xFFFFFFFF;}
      ctx.fillStyle="#fff"; for(let r=0;r<25;r++) for(let cc=0;cc<25;cc++) if(rnd()>.5) ctx.fillRect(cc*8,r*8,8,8);
      [[0,0],[sz-28,0],[0,sz-28]].forEach(([x,y])=>{ctx.fillStyle="#13131c";ctx.fillRect(x,y,28,28);ctx.fillStyle=ac();ctx.fillRect(x+6,y+6,16,16);});
    },100);
  };

  return wrap;
}

function renderTabEvolucao(cont) {

  if(h.length>=2){setTimeout(()=>{const c=document.getElementById("chartPeso");if(!c)return;const ctx=c.getContext("2d");c.width=c.offsetWidth*2;c.height=200;ctx.scale(2,2);const W=c.offsetWidth/2,H=100;const vals=h.map(x=>x.v),mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;const pts=h.map((x,i)=>({x:(i/(h.length-1))*W,y:H-((x.v-mn)/(mx-mn))*H}));ctx.fillStyle="#13131c";ctx.fillRect(0,0,W,H);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=ac()+"33";ctx.fill();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.strokeStyle=ac();ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.lineCap="round";ctx.stroke();pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=ac();ctx.fill();ctx.strokeStyle="#13131c";ctx.lineWidth=2;ctx.stroke();});},100);}

  shareBtn.onclick=()=>window.open(`https://wa.me/?text=${encodeURIComponent(`*Evolução de ${a.nome}*\nPeso inicial: ${first?.v||"—"}kg\nPeso atual: ${last?.v||"—"}kg${diff!==null?" ("+diff+"kg)":""}\nFitPro 💪`)}`,"_blank");

  wrap.appendChild(hd);
  const c=document.createElement("div");c.style.padding="20px";
  exs.forEach((e,i)=>{
    const isDone=tr.feitos.includes(i),isSkip=tr.pulados.includes(i),isCur=i===tr.idx;
    const card=document.createElement("div");card.style.cssText=`background:${isCur?ac()+"15":"var(--card)"};border:1.5px solid ${isDone?"#10B98133":isSkip?"#33333333":isCur?ac():"var(--bd)"};border-radius:16px;padding:16px;margin-bottom:10px;opacity:${isDone||isSkip?.55:1};cursor:${isDone||isSkip?"default":"pointer"}`;
    if(!isDone&&!isSkip)card.onclick=()=>{tr.idx=i;ir("treino");};
    card.innerHTML=`<div style="display:flex;align-items:center;gap:12px"><div style="width:40px;height:40px;border-radius:12px;background:${isDone?"#10B98133":isSkip?"#2a2a3a":isCur?ac()+"33":"var(--bd)"};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${isDone?"✅":isSkip?"⏭":ICONS[e.grupo]||"💪"}</div><div style="flex:1"><div style="font-weight:800;color:${isDone?"#10B981":isSkip?"#555":"#fff"};font-size:14px">${e.nome}</div><div style="font-size:12px;color:#8899aa;margin-top:2px">${e.series}×${e.reps}${e.carga?" · "+e.carga+"kg":""} · ${e.descanso}s</div></div>${isCur&&!isDone&&!isSkip?`<div style="width:8px;height:8px;border-radius:50%;background:${ac()};box-shadow:0 0 8px ${ac()}"></div>`:""}</div>`;

    }
    c.appendChild(card);

  if(tr.notas){const n=document.createElement("div");n.style.cssText=`padding:12px;background:#1a1f2e;border-radius:10px;margin-top:8px;border-left:3px solid ${ac()}`;n.innerHTML=`<div style="font-size:11px;color:${ac()};font-weight:800;margin-bottom:4px">ANOTAÇÕES</div><div style="font-size:13px;color:#aabbcc;line-height:1.65;white-space:pre-wrap">${tr.notas}</div>`;c.appendChild(n);}

  return wrap;

  wrap.innerHTML=`<div style="padding:18px 20px 0"><div style="font-size:22px;font-weight:900;margin-bottom:4px">Biblioteca</div><div style="font-size:13px;color:#8899aa;margin-bottom:14px">${total} exercícios em ${Object.keys(GRUPOS).length} grupos</div><input id="exBusca" class="inp" placeholder="🔍 Buscar exercício..."><div id="exLista"></div></div>`;
  let aberto=null;
  function renderEx(q=""){const el=wrap.querySelector("#exLista");el.innerHTML="";Object.entries(GRUPOS).forEach(([g,lista])=>{const fil=lista.filter(e=>e.toLowerCase().includes(q.toLowerCase()));if(q&&!fil.length)return;const isOpen=q.length>0||aberto===g;const div=document.createElement("div");div.style.marginBottom="10px";const hd2=document.createElement("div");hd2.style.cssText=`background:#1a1f2e;border:1px solid ${isOpen?GCOLOR[g]:"var(--bd)"};border-radius:${isOpen?"14px 14px 0 0":"14px"};padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px`;hd2.innerHTML=`<div style="width:40px;height:40px;border-radius:12px;background:${GCOLOR[g]}22;display:flex;align-items:center;justify-content:center;font-size:20px">${ICONS[g]}</div><div style="flex:1"><div style="font-weight:800;font-size:15px">${g}</div><div style="font-size:12px;color:#8899aa;margin-top:2px">${fil.length} exercícios</div></div><div style="color:#8899aa;font-size:18px;transform:${isOpen?"rotate(90deg)":"none"};transition:transform .2s">›</div>`;hd2.onclick=()=>{aberto=isOpen&&!q?null:g;renderEx(q);};div.appendChild(hd2);if(isOpen){const body=document.createElement("div");body.style.cssText=`background:#1a1f2e;border-radius:0 0 14px 14px;border:1px solid ${GCOLOR[g]};border-top:none;padding:8px 14px 14px`;fil.forEach((ex,i)=>{const row=document.createElement("div");row.style.cssText=`display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:${i<fil.length-1?"1px solid var(--bd)":"none"}`;row.innerHTML=`<div style="width:24px;height:24px;border-radius:6px;background:${GCOLOR[g]}22;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">${ICONS[g]}</div><div style="flex:1;font-size:13px;color:#ddd;font-weight:500">${ex}</div>`;body.appendChild(row);});div.appendChild(body);}wrap.querySelector("#exLista").appendChild(div);});}
  renderEx();setTimeout(()=>{const b=wrap.querySelector("#exBusca");if(b)b.oninput=e=>renderEx(e.target.value);},50);
  wrap.appendChild(navBar("exercicios"));return wrap;
}

// ── CONFIG ──
function telaConfig() {
  const wrap=document.createElement("div");wrap.className="screen";wrap.style.paddingTop="56px";
  const cont=document.createElement("div");cont.style.padding="18px 20px 0";

  cont.innerHTML=`<div style="font-size:22px;font-weight:900;margin-bottom:20px">Configurações</div>
  <div class="card" style="border-radius:18px">
    <div style="font-weight:800;font-size:15px;margin-bottom:4px">🎨 Identidade Visual</div>
    <div style="font-size:12px;color:#8899aa;margin-bottom:16px">Configure a marca do seu app</div>

      <div><input type="file" id="logoInput" accept="image/*" style="display:none"><button onclick="document.getElementById('logoInput').click()" style="padding:8px 16px;background:${ac()}22;border:1px solid ${ac()}55;border-radius:10px;color:${ac()};font-weight:700;font-size:13px;cursor:pointer;font-family:sans-serif;display:block;margin-bottom:6px">📸 Escolher logo</button>${S.config.logo?`<button onclick="removerLogo()" style="background:none;border:none;color:#ef4444;font-size:12px;cursor:pointer;font-family:sans-serif">Remover</button>`:""}</div>
    </div>
    <span class="lbl">Nome / Marca</span>
    <input id="cfgNome" class="inp" placeholder="Ex: Estúdio Força Total" value="${S.config.name||""}">
    <span class="lbl">Senha do Personal</span>

    <span class="lbl">Cor Principal</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${CORES2.map(c=>`<button onclick="selCor('${c}')" data-c="${c}" style="width:36px;height:36px;border-radius:10px;background:${c};border:${S.config.color===c?"3px solid #fff":"3px solid transparent"};cursor:pointer;transition:all .15s;box-shadow:${S.config.color===c?"0 0 10px "+c+"88":"none"}" class="corCfg"></button>`).join("")}
    </div>
    <div style="background:#0f1117;border-radius:12px;padding:12px;border:1px solid var(--bd);margin-bottom:16px">
      <div style="font-size:11px;color:#8899aa;margin-bottom:8px;font-weight:700">PRÉVIA</div>
      <div style="display:flex;align-items:center;gap:10px"><div id="prevLogo" style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,${ac()},${ac()}99);display:flex;align-items:center;justify-content:center;font-size:18px">⚡</div><div id="prevNome" style="font-size:18px;font-weight:900">${S.config.name||"FitPro"}</div></div>
      <button id="prevBtn" style="margin-top:10px;padding:8px 20px;background:${ac()};border:none;border-radius:10px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:sans-serif">Botão de exemplo</button>
    </div>
    <button id="cfgSaveBtn" onclick="salvarCfg()" class="btn" style="background:${ac()}">Salvar Configurações</button>
  </div>
  <div class="card" style="border-radius:18px">
    <div style="font-weight:800;font-size:15px;margin-bottom:4px">📝 Bloco de Notas</div>
    <div style="font-size:12px;color:#8899aa;margin-bottom:12px">Espaço livre para anotar qualquer coisa</div>
    <textarea id="adminNotas" class="inp" style="min-height:150px;margin-bottom:12px" placeholder="Anotações, lembretes, ideias...">${S.notas||""}</textarea>
    <button onclick="salvarNotasAdmin()" class="btn" style="background:${ac()}">💾 Salvar Notas</button>
  </div>
  <div class="card" style="border-radius:18px">
    <div style="font-weight:800;font-size:15px;margin-bottom:14px">➕ Adicionar Exercício</div>
    <span class="lbl">Grupo</span>
    <div style="display:flex;flex-wrap:wrap;margin-bottom:14px">${Object.keys(GRUPOS).map(g=>`<button class="chip${window._exGrp===g?" on":""}" onclick="selExGrp('${g}')" id="cfg_${g}">${ICONS[g]} ${g}</button>`).join("")}</div>
    <span class="lbl">Nome do Exercício</span>
    <div style="display:flex;gap:8px;margin-bottom:0">
      <input id="novoEx" class="inp" style="flex:1;margin-bottom:0" placeholder="Nome do exercício...">
      <button onclick="adicionarEx()" style="padding:11px 16px;background:${ac()};border:none;border-radius:10px;color:#fff;font-weight:700;font-size:16px;cursor:pointer">+</button>
    </div>
  </div>
  <button onclick="sair()" class="btn" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#ef4444;margin-top:4px">Sair do Aplicativo</button>
  <div style="text-align:center;font-size:12px;color:#222;margin:16px 0 28px">FitPro v3.0 · Feito para Personal Trainers</div>`;
  wrap.appendChild(cont);
  window._exGrp=window._exGrp||"Peito";
  window.selCor=c=>{S.config.color=c;wrap.querySelectorAll(".corCfg").forEach(b=>{const bc=b.getAttribute("data-c");b.style.border=bc===c?"3px solid #fff":"3px solid transparent";b.style.boxShadow=bc===c?`0 0 10px ${bc}88`:"none";});document.getElementById("prevBtn").style.background=c;};
  window.selExGrp=g=>{window._exGrp=g;wrap.querySelectorAll("[id^='cfg_']").forEach(b=>{const bg=b.id.replace("cfg_","");if(bg===g){b.classList.add("on");b.style.borderColor=GCOLOR[g];b.style.background=GCOLOR[g]+"22";b.style.color=GCOLOR[g];}else{b.classList.remove("on");b.style.borderColor="var(--bd)";b.style.background="var(--card)";b.style.color="#555";}});};
  window.removerLogo=()=>{S.config.logo="";ir("config");};
  document.getElementById("logoInput")?.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=ev=>{S.config.logo=ev.target.result;const lp=document.getElementById("logoPreview");if(lp)lp.innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;border-radius:14px;object-fit:cover">`;};reader.readAsDataURL(f);});
  document.getElementById("cfgNome")?.addEventListener("input",e=>{const pn=document.getElementById("prevNome");if(pn)pn.textContent=e.target.value||"FitPro";});
  window.salvarCfg=async()=>{S.config.name=document.getElementById("cfgNome")?.value||"FitPro";S.config.pass=document.getElementById("cfgSenha")?.value||"1234";await salvarConfig();toast("✅ Configurações salvas!");r();};
  window.salvarNotasAdmin=async()=>{S.notas=document.getElementById("adminNotas")?.value||"";await salvarNotas(S.notas);toast("✅ Notas salvas!");};
  window.adicionarEx=()=>{const n=document.getElementById("novoEx")?.value.trim();if(!n){toast("❌ Digite o nome!");return;}GRUPOS[window._exGrp].push(n);document.getElementById("novoEx").value="";toast(`✅ "${n}" adicionado em ${window._exGrp}!`);};
  window.sair=()=>{S.role=null;ir("login");};
  wrap.appendChild(navBar("config"));return wrap;
}

// ── ÁREA DO ALUNO ──
function telaAlunoHome() {
  const a=S.alunos.find(x=>x.id===S.studentId);
  if(!a){ir("login");return document.createElement("div");}
  const wrap=document.createElement("div");wrap.className="screen";
  const nav2=[{id:"home",i:"🏠",l:"Início"},{id:"treino",i:"💪",l:"Treino"},{id:"evolucao",i:"📈",l:"Evolução"},{id:"chat",i:"💬",l:"Chat"}];
  const tab=S.tabAluno||"home";
  const c=document.createElement("div");c.style.padding="60px 20px 0";

  if(tab==="home"){
    const tw=a.treinos?.[0];
    c.innerHTML=`<div style="font-size:13px;color:#8899aa;margin-bottom:4px">Bem-vindo,</div><div style="font-size:26px;font-weight:900;margin-bottom:20px">${a.nome.split(" ")[0]} 👊</div>`;
    if(tw){const tc=document.createElement("div");tc.style.cssText=`background:linear-gradient(135deg,${ac()}22,#0e0e1a);border-radius:20px;padding:20px;border:1px solid ${ac()}44;margin-bottom:16px`;tc.innerHTML=`<div style="font-size:11px;color:${ac()};font-weight:800;margin-bottom:8px;letter-spacing:.5px">TREINO DE HOJE</div><div style="font-size:20px;font-weight:900;margin-bottom:4px">${tw.nome}</div><div style="font-size:13px;color:#8899aa;margin-bottom:16px">${tw.exercicios?.length||0} exercícios · ${tw.dia}</div>`;const sb=document.createElement("button");sb.style.cssText=`background:${ac()};border:none;border-radius:12px;padding:13px 28px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:sans-serif;display:flex;align-items:center;gap:8px`;sb.innerHTML="▶ INICIAR TREINO";sb.onclick=()=>{S.treino={...tw,idx:0,feitos:[],pulados:[]};ir("treino");};tc.appendChild(sb);c.appendChild(tc);}
    else c.innerHTML+=`<div class="card" style="border-radius:20px;text-align:center;padding:20px;margin-bottom:16px"><div style="font-size:36px;margin-bottom:8px">🎉</div><div style="font-weight:800">Dia de descanso!</div></div>`;
    const grid=document.createElement("div");grid.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px";
    grid.innerHTML=`<div class="card" style="border-radius:16px;margin-bottom:0"><div style="font-size:26px;font-weight:900;color:#10B981">${a.freq||0}%</div><div style="font-size:12px;color:#8899aa;margin-top:4px">Frequência</div></div><div class="card" style="border-radius:16px;margin-bottom:0"><div style="font-size:26px;font-weight:900;color:${ac()}">${a.peso||"—"}</div><div style="font-size:12px;color:#8899aa;margin-top:4px">Peso (kg)</div></div>`;
    c.appendChild(grid);
  }
  else if(tab==="treino"){
    c.innerHTML=`<div style="font-size:22px;font-weight:900;margin-bottom:16px">Meus Treinos</div>`;
    if(!a.treinos?.length)c.innerHTML+=`<div style="text-align:center;padding:40px 0;color:#8899aa">Nenhum treino cadastrado</div>`;
    (a.treinos||[]).forEach(tr=>{const card=document.createElement("div");card.className="card";card.style.borderRadius="18px";card.innerHTML=`<div style="font-weight:800;font-size:16px;margin-bottom:2px">${tr.nome}</div><div style="font-size:12px;color:#8899aa;margin-bottom:12px">📅 ${tr.dia} · ${tr.exercicios?.length||0} exercícios</div>`;(tr.exercicios||[]).forEach(ex=>{const row=document.createElement("div");row.style.cssText="display:flex;align-items:center;gap:10px;padding:10px;background:#0f1117;border-radius:10px;margin-bottom:6px";row.innerHTML=`<div style="width:28px;height:28px;border-radius:8px;background:${ac()}33;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${ICONS[ex.grupo]||"💪"}</div><div style="flex:1"><div style="font-weight:700;font-size:13px">${ex.nome}</div><div style="font-size:11px;color:#8899aa">${ex.series}×${ex.reps}${ex.carga?" · "+ex.carga+"kg":""}</div>${ex.obs?`<div style="font-size:11px;color:${ac()};margin-top:2px">${ex.obs}</div>`:""}</div>`;card.appendChild(row);});if(tr.notas){const n=document.createElement("div");n.style.cssText=`margin-top:10px;padding:10px 12px;background:#0f1117;border-radius:10px;border-left:3px solid ${ac()}`;n.innerHTML=`<div style="font-size:11px;color:${ac()};font-weight:800;margin-bottom:4px">ANOTAÇÕES DO PERSONAL</div><div style="font-size:12px;color:#aabbcc;line-height:1.6;white-space:pre-wrap">${tr.notas}</div>`;card.appendChild(n);}const sb=document.createElement("button");sb.className="btn";sb.style.cssText=`background:${ac()};margin-top:10px`;sb.innerHTML="▶ INICIAR TREINO";sb.onclick=()=>{S.treino={...tr,idx:0,feitos:[],pulados:[]};ir("treino");};card.appendChild(sb);c.appendChild(card);});
  }
  else if(tab==="evolucao"){
    const h=a.historicoPeso||[],first=h[0],last=h[h.length-1],diff=first&&last?(last.v-first.v).toFixed(1):null;
    c.innerHTML=`<div style="font-size:22px;font-weight:900;margin-bottom:16px">Minha Evolução</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px"><div class="card" style="border-radius:14px;text-align:center;margin-bottom:0"><div style="font-size:18px;font-weight:900">${first?.v||"—"}</div><div style="font-size:9px;color:#8899aa;margin-top:4px;font-weight:800">INICIAL kg</div></div><div class="card" style="border-radius:14px;text-align:center;margin-bottom:0"><div style="font-size:18px;font-weight:900;color:${ac()}">${last?.v||"—"}</div><div style="font-size:9px;color:#8899aa;margin-top:4px;font-weight:800">ATUAL kg</div></div><div class="card" style="border-radius:14px;text-align:center;margin-bottom:0"><div style="font-size:18px;font-weight:900">${diff!==null?(parseFloat(diff)>0?"+":"")+diff:"—"}</div><div style="font-size:9px;color:#8899aa;margin-top:4px;font-weight:800">VARIAÇÃO kg</div></div></div><div class="card" style="border-radius:16px"><div style="font-weight:800;margin-bottom:14px">Evolução de Peso</div><canvas id="stuChart" style="width:100%;height:100px"></canvas>${!h.length?`<div style="text-align:center;color:#8899aa;font-size:13px;padding:20px 0">Nenhum registro ainda</div>`:""}</div>`;
    if(h.length>=2)setTimeout(()=>{const cv=document.getElementById("stuChart");if(!cv)return;const ctx=cv.getContext("2d");cv.width=cv.offsetWidth*2;cv.height=200;ctx.scale(2,2);const W=cv.offsetWidth/2,H=100;const vals=h.map(x=>x.v),mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;const pts=h.map((x,i)=>({x:(i/(h.length-1))*W,y:H-((x.v-mn)/(mx-mn))*H}));ctx.fillStyle="#13131c";ctx.fillRect(0,0,W,H);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=ac()+"33";ctx.fill();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.strokeStyle=ac();ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.lineCap="round";ctx.stroke();pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=ac();ctx.fill();ctx.strokeStyle="#13131c";ctx.lineWidth=2;ctx.stroke();});},100);
  }
  else if(tab==="chat"){
    c.innerHTML=`<div style="font-size:22px;font-weight:900;margin-bottom:16px">Chat com Personal</div>`;
    const msgs=a.msgs||[];
    const chatDiv=document.createElement("div");chatDiv.style.cssText="height:50vh;overflow-y:auto;padding-bottom:8px";
    if(!msgs.length)chatDiv.innerHTML=`<div style="text-align:center;padding:30px 0;color:#8899aa">Nenhuma mensagem ainda</div>`;
    msgs.forEach(m=>{const row=document.createElement("div");row.style.cssText=`display:flex;justify-content:${m.de==="trainer"?"flex-end":"flex-start"};margin-bottom:10px`;const b=document.createElement("div");b.style.cssText=`max-width:80%;background:${m.de==="trainer"?ac():"var(--card)"};border-radius:${m.de==="trainer"?"16px 16px 4px 16px":"16px 16px 16px 4px"};padding:10px 14px;border:${m.de==="trainer"?"none":"1px solid var(--bd)"}`;b.innerHTML=`<div style="font-size:14px;line-height:1.5">${m.txt}</div><div style="font-size:10px;color:${m.de==="trainer"?"rgba(255,255,255,.5)":"#555"};margin-top:4px;text-align:right">${m.hora}</div>`;row.appendChild(b);chatDiv.appendChild(row);});
    setTimeout(()=>chatDiv.scrollTop=chatDiv.scrollHeight,50);
    const inputRow=document.createElement("div");inputRow.style.cssText="display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--bd)";
    const inp=document.createElement("input");inp.style.cssText="flex:1;background:#1a1f2e;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;color:#fff;font-size:14px;outline:none;font-family:sans-serif";inp.placeholder="Mensagem...";
    const envBtn=document.createElement("button");envBtn.style.cssText=`width:44px;height:44px;border-radius:12px;background:${ac()};border:none;cursor:pointer;font-size:18px;color:#fff;flex-shrink:0`;envBtn.textContent="↑";
    async function enviarChat(){const t=inp.value.trim();if(!t)return;inp.value="";const aAtual=S.alunos.find(x=>x.id===S.studentId);if(!aAtual.msgs)aAtual.msgs=[];aAtual.msgs.push({de:"student",txt:t,hora:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});await salvarAluno(aAtual);await carregarAlunos();S.tabAluno="chat";ir("alunoHome");}
    envBtn.onclick=enviarChat;inp.onkeydown=e=>e.key==="Enter"&&enviarChat();
    inputRow.appendChild(inp);inputRow.appendChild(envBtn);c.appendChild(chatDiv);c.appendChild(inputRow);
  }

  wrap.appendChild(c);
  const navEl=document.createElement("div");navEl.className="nav";
  nav2.forEach(n=>{const b=document.createElement("button");b.className="nb";b.style.color=tab===n.id?ac():"#555";b.innerHTML=`<span style="font-size:20px">${n.i}</span><span>${n.l}</span>${tab===n.id?`<div style="width:4px;height:4px;border-radius:50%;background:${ac()}"></div>`:""}`;b.onclick=()=>{S.tabAluno=n.id;ir("alunoHome");};navEl.appendChild(b);});
  wrap.appendChild(navEl);
  return wrap;
}

// ── INIT ──
async function init() {
  try {
    await carregarConfig();
    await carregarAlunos();
    await carregarNotas();
    document.getElementById("loading").remove();
    r();
  } catch(e) {
    document.getElementById("loading").innerHTML = `<div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:16px">❌</div><div style="font-size:18px;font-weight:700;color:#fff;margin-bottom:8px">Erro ao conectar</div><div style="font-size:14px;color:#8899aa;margin-bottom:24px">${e.message}</div><button onclick="location.reload()" style="padding:14px 28px;background:#3B82F6;border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer;font-size:15px">Tentar Novamente</button></div>`;
  }
}

window.addEventListener("load", init);
</script>
</body>
</html>
