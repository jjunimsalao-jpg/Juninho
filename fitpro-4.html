<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0a0a10;--card:#13131c;--border:#1e1e2e;
    --ac:#3B82F6;--green:#10B981;--red:#EF4444;--yellow:#F59E0B;
    --text:#ffffff;--muted:#555;--soft:#888;
    --bd:#1e1e2e;--gr:#10B981;--rd:#EF4444;--yw:#F59E0B;
  }
  body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  input,button,textarea,select{font-family:'Outfit',sans-serif;}
  ::-webkit-scrollbar{width:3px;height:3px;}
  ::-webkit-scrollbar-thumb{background:#1e1e2e;border-radius:4px;}
  .app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;}
  .screen{min-height:100vh;background:var(--bg);padding-bottom:80px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;}
  .btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;}
  .btn-primary{background:var(--ac);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--soft);}
  .input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-size:15px;font-family:'Outfit',sans-serif;outline:none;}
  .input:focus{border-color:var(--ac);}
  .label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;display:block;margin-bottom:8px;}
  .nav-bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--card);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;z-index:100;}
  .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:6px 0;font-family:'Outfit',sans-serif;color:var(--muted);transition:color .15s;}
  .nav-btn.active{color:var(--ac);}
  .nav-btn svg{width:22px;height:22px;}
  .nav-dot{width:4px;height:4px;border-radius:50%;background:var(--ac);}
  .tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;}
  .avatar{border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex-shrink:0;}
  .bar-wrap{height:5px;border-radius:99px;background:#1e1e2e;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;transition:width .5s;}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
  .anim{animation:up .35s ease both;}
  .hidden{display:none!important;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .modal{background:var(--card);border-radius:20px;padding:24px;border:1px solid var(--border);width:100%;max-width:390px;max-height:90vh;overflow-y:auto;}
  .chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s;}
  .chip.sel{border-color:var(--ac);background:rgba(59,130,246,.15);color:var(--ac);}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 24px;border-radius:30px;font-weight:700;font-size:14px;z-index:9998;animation:up .3s ease both;box-shadow:0 4px 20px rgba(16,185,129,.4);}
  .section-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:12px;}
  .divider{height:1px;background:var(--border);margin:16px 0;}
  textarea.input{resize:vertical;min-height:100px;line-height:1.6;}
</style>
</head>

/* ── FIREBASE HELPERS ── */
async function saveStudent(s) {
  await db.collection("fitpro_students").doc(s.id).set(s);
}
async function loadStudents() {
  const snap = await db.collection("fitpro_students").get();
  STATE.students = snap.docs.map(d=>d.data());
}
async function deleteStudent(id) {
  await db.collection("fitpro_students").doc(id).delete();
}
async function saveSettings(s) {
  await db.collection("fitpro_config").doc("settings").set(s);
}
async function loadSettings() {
  const d = await db.collection("fitpro_config").doc("settings").get();
  if (d.exists) STATE.settings = {...STATE.settings,...d.data()};
}
async function saveAdminNotes(txt) {
  await db.collection("fitpro_config").doc("notes").set({text:txt});
}
async function loadAdminNotes() {
  const d = await db.collection("fitpro_config").doc("notes").get();
  if (d.exists) STATE.adminNotes = d.data().text||"";
}

/* ── TOAST ── */
function showToast(msg, dur=2200) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), dur);
}

/* ── RENDER ENGINE ── */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const s = STATE.screen;
  if (s==="login") app.appendChild(renderLogin());
  else if (s==="dashboard") app.appendChild(renderDashboard());
  else if (s==="students") app.appendChild(renderStudents());
  else if (s==="profile") app.appendChild(renderProfile());
  else if (s==="ai") app.appendChild(renderAI());
  else if (s==="exercises") app.appendChild(renderExercises());
  else if (s==="settings") app.appendChild(renderSettings());
  else if (s==="workoutBuilder") app.appendChild(renderWorkoutBuilder());
  else if (s==="activeWorkout") app.appendChild(renderActiveWorkout());
  else if (s==="studentHome") app.appendChild(renderStudentHome());
  else if (s==="newStudent") app.appendChild(renderNewStudent());
  else if (s==="editStudent") app.appendChild(renderEditStudent());
}

  const items = [

    {id:"exercises",label:"Exerc.",svg:`<path d="M6 5v14"/><path d="M18 5v14"/><path d="M2 9h4"/><path d="M2 15h4"/><path d="M18 9h4"/><path d="M18 15h4"/><path d="M6 12h12"/>`},
    {id:"settings",label:"Config",svg:`<circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>`},
  ];
  const div = el("div","nav-bottom");
  items.forEach(item=>{
    const btn = el("button",`nav-btn${active===item.id?" active":""}`);
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${item.svg}</svg><span style="font-size:10px;font-weight:700;letter-spacing:.3px">${item.label}</span>${active===item.id?'<div class="nav-dot"></div>':""}`;

    btn.onclick = ()=>nav(item.id);

/* ── HELPERS ── */
function el(tag, cls="", html="") {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  return e;
}
function avatar(s, size=48) {
  const d = el("div","avatar");
  d.style.cssText = `width:${size}px;height:${size}px;background:${s.color||"#3B82F6"};font-size:${size*.33}px;border-radius:${Math.min(size*.35,18)}px;box-shadow:0 4px 14px ${s.color||"#3B82F6"}44;flex-shrink:0;position:relative;`;
  d.textContent = s.initials||(s.name||"?").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return d;
}
function bar(val, max=100, color="#3B82F6", h=5) {
  const w = el("div","bar-wrap"); w.style.height=h+"px";
  const f = el("div","bar-fill"); f.style.cssText=`width:${Math.min(100,(val/max)*100)}%;background:${color};`;
  w.appendChild(f); return w;
}
function statusDot(status) {
  const map={active:"#10B981",inactive:"#EF4444",training:"#F59E0B"};
  const lbl={active:"Ativo",inactive:"Inativo",training:"Treinando"};
  const c=map[status]||"#555";
  const s=el("span",""); s.style.cssText=`display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:${c}`;
  s.innerHTML=`<span style="width:6px;height:6px;border-radius:50%;background:${c};box-shadow:0 0 6px ${c};display:inline-block"></span>${lbl[status]||status}`;
  return s;
}
function section(title) {
  const d=el("div"); d.style.cssText="font-size:13px;font-weight:800;color:#fff;margin-bottom:12px;";
  d.textContent=title; return d;
}
function modal(content, onClose) {
  const ov=el("div","modal-overlay");
  const m=el("div","modal"); m.appendChild(content);
  ov.appendChild(m);
  ov.onclick=e=>{ if(e.target===ov){ ov.remove(); if(onClose) onClose(); }};
  document.body.appendChild(ov);
  return ov;
}

      <button id="btn-trainer" onclick="window._setRole('trainer')" style="flex:1;padding:11px 0;border-radius:11px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:'Outfit',sans-serif;transition:all .2s;background:${ac()};color:#fff">Personal</button>
      <button id="btn-student" onclick="window._setRole('student')" style="flex:1;padding:11px 0;border-radius:11px;border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:'Outfit',sans-serif;transition:all .2s;background:transparent;color:var(--muted)">Aluno</button>
    </div>
    <div style="width:100%;max-width:320px;animation:up .4s .18s ease both;opacity:0;animation-fill-mode:forwards">
      <div id="student-field" style="display:none;margin-bottom:14px">
        <input id="student-code" class="input" placeholder="Digite seu nome de acesso..." style="width:100%">
      </div>
      <div id="trainer-pass-field" style="display:none;margin-bottom:14px">
        <input id="trainer-pass" type="password" class="input" placeholder="Senha do personal..." style="width:100%">
      </div>
      <button onclick="window._doLogin()" style="width:100%;padding:16px;background:linear-gradient(135deg,${ac()},${ac()}bb);border:none;border-radius:14px;color:#fff;font-weight:800;font-size:16px;font-family:'Outfit',sans-serif;cursor:pointer;box-shadow:0 8px 28px ${ac()}44" id="login-btn">Entrar como Personal</button>
      <div id="login-hint" style="font-size:12px;color:#333;text-align:center;margin-top:10px"></div>
    </div>
  `;

  window._loginRole = "trainer";
  window._setRole = function(r) {
    window._loginRole = r;
    document.getElementById("btn-trainer").style.background = r==="trainer"?ac():"transparent";
    document.getElementById("btn-trainer").style.color = r==="trainer"?"#fff":"var(--muted)";
    document.getElementById("btn-student").style.background = r==="student"?ac():"transparent";
    document.getElementById("btn-student").style.color = r==="student"?"#fff":"var(--muted)";
    document.getElementById("student-field").style.display = r==="student"?"block":"none";
    document.getElementById("trainer-pass-field").style.display = r==="trainer"?"block":"none";
    document.getElementById("login-btn").textContent = r==="trainer"?"Entrar como Personal":"Acessar Meus Treinos";
    document.getElementById("login-hint").textContent = r==="student"?"Digite seu nome cadastrado pelo personal":"";
  };
  window._setRole("trainer");

  window._doLogin = async function() {
    if (window._loginRole==="trainer") {
      const pass = document.getElementById("trainer-pass").value;
      if (pass !== (STATE.settings.adminPass||"1234")) {
        showToast("❌ Senha incorreta!"); return;
      }
      STATE.role="trainer"; nav("dashboard");
    } else {
      const code = document.getElementById("student-code").value.trim().toLowerCase();
      const found = STATE.students.find(s=>s.name.split(" ")[0].toLowerCase()===code || s.accessCode===code);
      if (found) { STATE.role="student"; STATE.studentId=found.id; nav("studentHome"); }
      else showToast("❌ Aluno não encontrado!");
    }
  };

  return wrap;
}

    card.appendChild(freq);

function openProfile(s) {
  STATE.currentStudent = STATE.students.find(x=>x.id===s.id)||s;
  STATE.profileTab = "treinos";
  nav("profile");
}

/* ══════════════════════════════════════
   STUDENTS LIST
══════════════════════════════════════ */
function renderStudents() {
  const wrap=el("div","screen"); wrap.style.paddingTop="56px";
  const cont=el("div"); cont.style.padding="18px 20px 0";
  cont.innerHTML=`<div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:14px">Meus Alunos</div>
    <div style="position:relative;margin-bottom:12px">
      <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)">🔍</span>
      <input id="student-search" class="input" placeholder="Buscar aluno..." style="padding-left:40px">
    </div>
    <div id="student-list"></div>`;
  wrap.appendChild(cont);

  function renderList(q="") {
    const list=wrap.querySelector("#student-list"); list.innerHTML="";
    let items=[...STATE.students].sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0));
    if (q) items=items.filter(s=>s.name.toLowerCase().includes(q.toLowerCase()));
    if (!items.length) { list.innerHTML=`<div style="text-align:center;padding:40px 0;color:var(--muted)">Nenhum aluno encontrado</div>`; return; }
    items.forEach((s,i)=>{
      const card=el("div","card anim"); card.style.cssText=`border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer;border:1.5px solid ${s.trainedToday?"#10B98133":"var(--border)"};animation-delay:${i*.06}s`;
      card.onclick=()=>openProfile(s);
      const row=el("div"); row.style.cssText="display:flex;align-items:center;gap:14px";
      row.appendChild(avatar(s,54));
      const info=el("div"); info.style.cssText="flex:1;min-width:0";
      info.innerHTML=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="font-weight:800;color:#fff;font-size:16px">${s.name}</span>${s.favorite?"⭐":""}</div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">${s.age||""}${s.age?" anos · ":""}${s.height||""}${s.height?"cm · ":""}${s.weight||""}${s.weight?"kg":""}</div>`;
      const tags=el("div"); tags.style.cssText="display:flex;align-items:center;gap:8px;flex-wrap:wrap";
      const gt=el("span","tag"); gt.style.cssText=`background:${s.color||ac()}22;color:${s.color||ac()}`; gt.textContent=s.goal||"";
      tags.appendChild(gt); tags.appendChild(statusDot(s.status||"active"));
      info.appendChild(tags);
      const brow=el("div"); brow.style.marginTop="10px"; brow.appendChild(bar(s.frequency||0,100,s.trainedToday?"#10B981":"#F59E0B",4));
      info.appendChild(brow);
      const right=el("div"); right.style.cssText="display:flex;flex-direction:column;align-items:flex-end;gap:8px";
      const favBtn=el("button"); favBtn.style.cssText=`background:none;border:none;cursor:pointer;font-size:18px;opacity:${s.favorite?1:.25}`;
      favBtn.textContent="⭐"; favBtn.onclick=async e=>{e.stopPropagation();s.favorite=!s.favorite;await saveStudent(s);renderList(document.getElementById("student-search").value);};
      right.appendChild(favBtn);
      right.innerHTML+=`<span style="font-size:10px;color:${s.trainedToday?"#10B981":"#EF4444"};font-weight:700">${s.trainedToday?"Treinou":"Sem treino"}</span>`;
      right.insertBefore(favBtn,right.firstChild);
      row.appendChild(info); row.appendChild(right); card.appendChild(row);
      list.appendChild(card);
    });
  }

  renderList();
  setTimeout(()=>{ const inp=wrap.querySelector("#student-search"); if(inp) inp.oninput=e=>renderList(e.target.value); },100);

  const addBtn=el("div"); addBtn.style.cssText="position:fixed;bottom:90px;right:20px;z-index:50";
  addBtn.innerHTML=`<button onclick="nav('newStudent')" style="width:54px;height:54px;border-radius:50%;background:${ac()};border:none;cursor:pointer;font-size:24px;color:#fff;box-shadow:0 4px 20px ${ac()}66;display:flex;align-items:center;justify-content:center">+</button>`;
  wrap.appendChild(addBtn);
  wrap.appendChild(renderNavBottom("students"));
  return wrap;
}

function renderNewStudent() {
  return renderStudentForm(null);
}
function renderEditStudent() {
  return renderStudentForm(STATE.currentStudent);
}
function renderStudentForm(existing) {
  const wrap=el("div","screen"); wrap.style.paddingTop="0;paddingBottom:100px";
  const s=existing||{};
  const selColor = s.color || COLORS[Math.floor(Math.random()*COLORS.length)];

  wrap.innerHTML=`
    <div style="padding:52px 20px 16px;border-bottom:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:14px">
      <button onclick="nav('students')" style="width:36px;height:36px;border-radius:11px;background:var(--border);border:none;cursor:pointer;color:#fff;font-size:18px;flex-shrink:0">‹</button>
      <div style="font-weight:900;color:#fff;font-size:18px">${existing?"Editar Aluno":"Novo Aluno"}</div>
    </div>
    <div style="padding:20px">
      <span class="label">Nome completo *</span>
      <input id="s-name" class="input" style="margin-bottom:14px" placeholder="Ex: João Silva" value="${s.name||""}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div><span class="label">Idade</span><input id="s-age" class="input" type="number" placeholder="25" value="${s.age||""}"></div>
        <div><span class="label">Altura (cm)</span><input id="s-height" class="input" type="number" placeholder="170" value="${s.height||""}"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div><span class="label">Peso (kg)</span><input id="s-weight" class="input" type="number" placeholder="70" value="${s.weight||""}"></div>
        <div><span class="label">Objetivo</span>
          <select id="s-goal" class="input">
            ${["Hipertrofia","Emagrecimento","Definição","Condicionamento","Reabilitação","Outro"].map(g=>`<option${s.goal===g?" selected":""}>${g}</option>`).join("")}
          </select>
        </div>
      </div>
      <span class="label">Código de Acesso (login do aluno)</span>
      <input id="s-code" class="input" style="margin-bottom:14px" placeholder="Ex: joao123" value="${s.accessCode||""}">
      <span class="label">Histórico de Saúde / Lesões</span>
      <textarea id="s-health" class="input" style="margin-bottom:14px;min-height:80px" placeholder="Ex: Hérnia L4/L5, hipertensão controlada...">${s.healthHistory||""}</textarea>
      <span class="label">Observações</span>
      <textarea id="s-obs" class="input" style="margin-bottom:14px;min-height:80px" placeholder="Ex: Treina de manhã, prefere aparelhos...">${s.observations||""}</textarea>
      <span class="label">Cor do perfil</span>
      <div id="color-picker" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
        ${COLORS.map(c=>`<button onclick="window._selColor('${c}')" data-color="${c}" style="width:36px;height:36px;border-radius:10px;background:${c};border:${selColor===c?"3px solid #fff":"3px solid transparent"};cursor:pointer;box-shadow:${selColor===c?"0 0 10px "+c+"88":"none"}" class="color-btn"></button>`).join("")}
      </div>
      <button onclick="window._saveStudent(${existing?"true":"false"})" class="btn btn-primary">${existing?"Salvar Alterações":"Cadastrar Aluno"}</button>
      ${existing?`<button onclick="window._deleteStudent()" class="btn" style="margin-top:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#ef4444">Excluir Aluno</button>`:""}
    </div>
  `;

  window._currentColor = selColor;
  window._selColor = function(c) {
    window._currentColor=c;
    wrap.querySelectorAll(".color-btn").forEach(b=>{
      const bc=b.getAttribute("data-color");
      b.style.border=bc===c?"3px solid #fff":"3px solid transparent";
      b.style.boxShadow=bc===c?`0 0 10px ${bc}88`:"none";
    });
  };

  window._saveStudent = async function(isEdit) {
    const name=document.getElementById("s-name").value.trim();
    if (!name) { showToast("❌ Nome obrigatório!"); return; }
    const id=isEdit?existing.id:("s_"+Date.now());
    const initials=name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
    const data = {
      id, name, initials,
      age: +document.getElementById("s-age").value||null,
      height: +document.getElementById("s-height").value||null,
      weight: +document.getElementById("s-weight").value||null,
      goal: document.getElementById("s-goal").value,
      accessCode: document.getElementById("s-code").value.trim()||name.split(" ")[0].toLowerCase(),
      healthHistory: document.getElementById("s-health").value,
      observations: document.getElementById("s-obs").value,
      color: window._currentColor,
      frequency: isEdit?(existing.frequency||0):0,
      trainedToday: isEdit?(existing.trainedToday||false):false,
      favorite: isEdit?(existing.favorite||false):false,
      status: isEdit?(existing.status||"active"):"active",
      lastVisit: isEdit?(existing.lastVisit||"—"):"—",
      joinDate: isEdit?(existing.joinDate||new Date().toLocaleDateString("pt-BR")):new Date().toLocaleDateString("pt-BR"),
      workouts: isEdit?(existing.workouts||[]):[],
      weightHistory: isEdit?(existing.weightHistory||[]):[],
      measurements: isEdit?(existing.measurements||{}):{},
      messages: isEdit?(existing.messages||[]):[],
    };
    await saveStudent(data);
    await loadStudents();
    showToast(isEdit?"✅ Aluno atualizado!":"✅ Aluno cadastrado!");
    nav("students");
  };

  window._deleteStudent = async function() {
    if (!confirm("Excluir este aluno?")) return;
    await deleteStudent(existing.id);
    await loadStudents();
    showToast("🗑 Aluno removido");
    nav("students");
  };

  return wrap;
}

    modal(cont);
    setTimeout(()=>{
      const c=document.getElementById("qr-canvas"); if(!c) return;
      const ctx=c.getContext("2d"),sz=200; c.width=sz;c.height=sz;
      ctx.fillStyle="#13131c";ctx.fillRect(0,0,sz,sz);
      let seed=0; const link=`fitpro/${s.id}`; for(let i=0;i<link.length;i++) seed=(seed*31+link.charCodeAt(i))&0xFFFFFF;
      function rnd(){seed^=seed<<13;seed^=seed>>17;seed^=seed<<5;return(seed>>>0)/0xFFFFFFFF;}
      ctx.fillStyle="#fff"; for(let r=0;r<25;r++) for(let cc=0;cc<25;cc++) if(rnd()>.5) ctx.fillRect(cc*8,r*8,8,8);
      [[0,0],[sz-28,0],[0,sz-28]].forEach(([x,y])=>{ctx.fillStyle="#13131c";ctx.fillRect(x,y,28,28);ctx.fillStyle=ac();ctx.fillRect(x+6,y+6,16,16);});
    },100);
  };

  return wrap;
}

function renderEvolucaoTab(cont) {
  const s=STATE.currentStudent;
  const hist=s.weightHistory||[];
  const first=hist[0], last=hist[hist.length-1];
  const diff=first&&last?(last.value-first.value).toFixed(1):null;

  cont.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="card" style="border-radius:14px;text-align:center"><div style="font-size:18px;font-weight:900;color:#fff">${first?.value||"—"}</div><div style="font-size:9px;color:var(--muted);margin-top:4px;font-weight:800;letter-spacing:.4px">INICIAL (kg)</div></div>
      <div class="card" style="border-radius:14px;text-align:center"><div style="font-size:18px;font-weight:900;color:${ac()}">${last?.value||"—"}</div><div style="font-size:9px;color:var(--muted);margin-top:4px;font-weight:800;letter-spacing:.4px">ATUAL (kg)</div></div>
      <div class="card" style="border-radius:14px;text-align:center"><div style="font-size:18px;font-weight:900;color:#fff">${diff!==null?(parseFloat(diff)>0?"+":"")+diff:"—"}</div><div style="font-size:9px;color:var(--muted);margin-top:4px;font-weight:800;letter-spacing:.4px">VARIAÇÃO (kg)</div></div>
    </div>
    <div class="card" style="border-radius:16px;margin-bottom:12px">
      <div style="font-weight:800;color:#fff;margin-bottom:14px">Evolução de Peso</div>
      <canvas id="weight-chart" style="width:100%;height:100px"></canvas>
      ${!hist.length?`<div style="text-align:center;color:var(--muted);font-size:13px;padding:20px 0">Nenhum registro ainda</div>`:""}
    </div>
  `;

  if (hist.length>=2) {
    setTimeout(()=>{
      const canvas=document.getElementById("weight-chart"); if(!canvas) return;
      const ctx2=canvas.getContext("2d"); canvas.width=canvas.offsetWidth*2; canvas.height=200; ctx2.scale(2,2);
      const W=canvas.offsetWidth/2,H=100;
      const vals=hist.map(d=>d.value), mn=Math.min(...vals)-1, mx=Math.max(...vals)+1;
      const pts=hist.map((d,i)=>({x:(i/(hist.length-1))*W,y:H-((d.value-mn)/(mx-mn))*H}));
      ctx2.fillStyle="#13131c"; ctx2.fillRect(0,0,W,H);
      const color=ac();
      ctx2.beginPath(); ctx2.moveTo(pts[0].x,pts[0].y);
      pts.forEach(p=>ctx2.lineTo(p.x,p.y));
      ctx2.lineTo(W,H); ctx2.lineTo(0,H); ctx2.closePath();
      ctx2.fillStyle=color+"33"; ctx2.fill();
      ctx2.beginPath(); ctx2.moveTo(pts[0].x,pts[0].y);
      pts.forEach(p=>ctx2.lineTo(p.x,p.y));
      ctx2.strokeStyle=color; ctx2.lineWidth=2.5; ctx2.lineJoin="round"; ctx2.lineCap="round"; ctx2.stroke();
      pts.forEach(p=>{ ctx2.beginPath(); ctx2.arc(p.x,p.y,4,0,Math.PI*2); ctx2.fillStyle=color; ctx2.fill(); ctx2.strokeStyle="#13131c"; ctx2.lineWidth=2; ctx2.stroke(); });
    },100);
  }

  // Register weight button
  const regBtn=el("button","btn btn-primary"); regBtn.style.marginBottom="10px"; regBtn.textContent="+ Registrar Peso Hoje";
  regBtn.onclick=()=>{
    const c=el("div");
    c.innerHTML=`<div style="font-size:16px;font-weight:800;color:#fff;margin-bottom:16px">⚖️ Registrar Peso</div><span class="label">Peso atual (kg)</span><input id="new-weight" class="input" type="number" step="0.1" placeholder="Ex: 82.5"><button onclick="window._saveWeight()" class="btn btn-primary" style="margin-top:12px">Salvar</button>`;
    modal(c);
  };
  cont.appendChild(regBtn);

  // Share button
  const shareBtn=el("button","btn"); shareBtn.style.cssText="background:#25D366;color:#fff;font-weight:800;margin-bottom:10px";
  shareBtn.innerHTML="📤 Compartilhar Evolução no WhatsApp";
  shareBtn.onclick=()=>{
    const text=`*Evolução de ${s.name}*\nPeso inicial: ${first?.value||"—"}kg\nPeso atual: ${last?.value||"—"}kg${diff!==null?" ("+diff+"kg)":""}\nFitPro 💪`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
  };
  cont.appendChild(shareBtn);

  window._saveWeight = async function(){
    const v=+document.getElementById("new-weight")?.value; if(!v) return;
    if (!STATE.currentStudent.weightHistory) STATE.currentStudent.weightHistory=[];
    STATE.currentStudent.weightHistory.push({date:new Date().toISOString().split("T")[0],value:v});
    STATE.currentStudent.weight=v;
    await saveStudent(STATE.currentStudent);
    await loadStudents();
    STATE.currentStudent=STATE.students.find(x=>x.id===STATE.currentStudent.id)||STATE.currentStudent;
    document.querySelector(".modal-overlay")?.remove();
    showToast("✅ Peso registrado!");
    STATE.profileTab="evolução"; nav("profile");
  };
}

  if (!msgs.length) chatDiv.innerHTML=`<div style="text-align:center;padding:30px 0;color:var(--muted)">Nenhuma mensagem ainda</div>`;

    const row=el("div"); row.style.cssText=`display:flex;justify-content:${m.from==="trainer"?"flex-end":"flex-start"};margin-bottom:10px`;
    const bubble=el("div"); bubble.style.cssText=`max-width:80%;background:${m.from==="trainer"?ac():"var(--card)"};border-radius:${m.from==="trainer"?"16px 16px 4px 16px":"16px 16px 16px 4px"};padding:10px 14px;border:${m.from==="trainer"?"none":"1px solid var(--border)"}`;
    bubble.innerHTML=`<div style="font-size:14px;color:#fff;line-height:1.5">${m.text}</div><div style="font-size:10px;color:${m.from==="trainer"?"rgba(255,255,255,.5)":"var(--muted)"};margin-top:4px;text-align:right">${m.time}</div>`;
    row.appendChild(bubble); chatDiv.appendChild(row);
  });
  setTimeout(()=>chatDiv.scrollTop=chatDiv.scrollHeight,100);

  const inputRow=el("div"); inputRow.style.cssText="display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--border)";
  const inp=el("input","input"); inp.placeholder="Mensagem..."; inp.style.flex="1";
  const sendBtn=el("button"); sendBtn.style.cssText=`width:44px;height:44px;border-radius:12px;background:${ac()};border:none;cursor:pointer;font-size:18px;color:#fff;flex-shrink:0`;
  sendBtn.textContent="↑";
  async function sendMsg(){
    const t=inp.value.trim(); if(!t) return; inp.value="";
    if (!STATE.currentStudent.messages) STATE.currentStudent.messages=[];
    STATE.currentStudent.messages.push({from:"trainer",text:t,time:new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})});
    await saveStudent(STATE.currentStudent);
    await loadStudents();
    STATE.currentStudent=STATE.students.find(x=>x.id===STATE.currentStudent.id)||STATE.currentStudent;
    STATE.profileTab="chat"; nav("profile");
  }
  sendBtn.onclick=sendMsg; inp.onkeydown=e=>e.key==="Enter"&&sendMsg();
  inputRow.appendChild(inp); inputRow.appendChild(sendBtn);
  cont.appendChild(chatDiv); cont.appendChild(inputRow);
}

    wrap.appendChild(Hdr(wb.name,"Selecione os grupos","window._wbStepBack('name')"));
    const cont=el("div"); cont.style.cssText="padding:20px;padding-bottom:120px";
    cont.innerHTML=`${Progress()}<div style="font-size:18px;font-weight:900;color:#fff;margin-bottom:4px">Quais grupos musculares?</div><div style="font-size:13px;color:var(--muted);margin-bottom:18px">Selecione um ou mais</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${groups.map(g=>`<div id="grp-${g}" onclick="window._toggleGroup('${g}')" style="background:${wb.groups.includes(g)?EX[g].color+"18":"var(--card)"};border:1.5px solid ${wb.groups.includes(g)?EX[g].color:"var(--border)"};border-radius:16px;padding:16px 14px;cursor:pointer;transition:all .15s"><div style="font-size:26px;margin-bottom:8px">${EX[g].icon}</div><div style="font-weight:800;color:${wb.groups.includes(g)?EX[g].color:"#fff"};font-size:14px">${g}</div><div style="font-size:11px;color:var(--muted);margin-top:2px">${EX[g].list.length} exercícios</div>${wb.groups.includes(g)?`<div style="margin-top:8px;font-size:11px;font-weight:800;color:${EX[g].color}">✓ Selecionado</div>`:""}</div>`).join("")}</div>`;
    wrap.appendChild(cont);
    const fixBtn=el("div"); fixBtn.style.cssText="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px 20px 28px;background:var(--bg);border-top:1px solid var(--border)";
    fixBtn.innerHTML=`<button onclick="window._wbGoExercises()" class="btn" style="background:${wb.groups.length>0?ac():"var(--border)"};color:#fff">${wb.groups.length>0?`Escolher Exercícios (${wb.groups.length} grupo${wb.groups.length>1?"s":""})` :"Selecione ao menos 1 grupo"}</button>`;

  else if (wb.step==="exercises") {

    const sl=wb.selEx[cg]||[];
    const hd=el("div"); hd.style.cssText="padding:52px 20px 14px;border-bottom:1px solid var(--border);background:var(--card)";
    hd.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><button onclick="window._wbExBack()" style="width:36px;height:36px;border-radius:11px;background:var(--border);border:none;cursor:pointer;color:#fff;font-size:18px;flex-shrink:0">‹</button><div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:20px">${db.icon}</span><span style="font-weight:900;color:#fff;font-size:18px">${cg}</span></div><div style="font-size:12px;color:var(--muted);margin-top:2px">Grupo ${gi+1}/${wb.groups.length} · ${sl.length} selecionado${sl.length!==1?"s":""}</div></div></div><div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none">${wb.groups.map(g=>`<button onclick="window._wbSetCurGroup('${g}')" style="flex-shrink:0;padding:5px 12px;border-radius:20px;border:1.5px solid ${cg===g?EX[g].color:"var(--border)"};background:${cg===g?EX[g].color+"22":"var(--card)"};color:${cg===g?EX[g].color:"var(--muted)"};font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif">${EX[g].icon} ${g} ${(wb.selEx[g]||[]).length>0?"("+wb.selEx[g].length+")":""}</button>`).join("")}</div>`;

    const cont=el("div"); cont.style.cssText="padding:14px 20px 100px";

    if (sl.length>0) {
      const sdiv=el("div"); sdiv.style.marginBottom="16px";

      sl.forEach(ex=>{
        const ec=el("div"); ec.style.cssText=`background:${db.color}0e;border:1px solid ${db.color}44;border-radius:14px;padding:14px;margin-bottom:10px`;
        ec.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span style="font-weight:800;color:#fff;font-size:14px">${ex.name}</span><button onclick="window._toggleEx('${cg}','${ex.name.replace(/'/g,"\\'")}',true)" style="background:rgba(239,68,68,.15);border:none;border-radius:8px;padding:4px 10px;color:#ef4444;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif">Remover</button></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px">${[{l:"Séries",f:"sets",p:"3",t:"number"},{l:"Reps",f:"reps",p:"12",t:"text"},{l:"Carga kg",f:"load",p:"—",t:"number"},{l:"Desc. s",f:"rest",p:"60",t:"number"}].map(fld=>`<div><div style="font-size:9px;color:var(--muted);font-weight:800;margin-bottom:4px;text-transform:uppercase">${fld.l}</div><input type="${fld.t}" value="${ex[fld.f]||""}" placeholder="${fld.p}" onchange="window._updateEx('${cg}','${ex.name.replace(/'/g,"\\'")}','${fld.f}',this.value)" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 4px;color:#fff;font-size:13px;font-family:'Outfit',sans-serif;outline:none;text-align:center"></div>`).join("")}</div><input value="${ex.obs||""}" placeholder="Observação..." onchange="window._updateEx('${cg}','${ex.name.replace(/'/g,"\\'")}','obs',this.value)" style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--soft);font-size:12px;font-family:'Outfit',sans-serif;outline:none">`;
        sdiv.appendChild(ec);
      });
      cont.appendChild(sdiv);
    }

    cont.innerHTML+=`<div style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.8px;margin-bottom:10px;text-transform:uppercase">Todos os exercícios de ${cg}</div>`;
    db.list.forEach((ex,i)=>{
      const sel=!!(wb.selEx[cg]||[]).find(e=>e.name===ex);
      const row=el("div"); row.style.cssText=`display:flex;align-items:center;gap:12px;padding:13px 14px;background:${sel?db.color+"15":"var(--card)"};border:1px solid ${sel?db.color:"var(--border)"};border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;animation:up .18s ${i*.012}s ease both;opacity:0;animation-fill-mode:forwards`;
      row.innerHTML=`<div style="width:28px;height:28px;border-radius:8px;background:${sel?db.color:"var(--border)"};display:flex;align-items:center;justify-content:center;font-size:${sel?13:11}px;flex-shrink:0;transition:all .15s">${sel?"✓":db.icon}</div><div style="flex:1;font-weight:600;color:${sel?"#fff":"var(--soft)"};font-size:14px">${ex}</div><div style="font-size:18px;color:${sel?db.color:"#333"}">${sel?"●":"+"}</div>`;
      row.onclick=()=>window._toggleEx(cg,ex,false);
      cont.appendChild(row);
    });

    wrap.appendChild(cont);
    const fixBtn=el("div"); fixBtn.style.cssText="position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px 20px 28px;background:var(--bg);border-top:1px solid var(--border)";
    const isLast=gi===wb.groups.length-1;
    fixBtn.innerHTML=`<button onclick="window._wbExNext()" class="btn btn-primary">${isLast?"Revisar Treino →":"Próximo: "+wb.groups[gi+1]+" →"}</button>`;
    wrap.appendChild(fixBtn);
  }

  else if (wb.step==="review") {
    const allEx=wb.groups.flatMap(g=>(wb.selEx[g]||[]).map(e=>({...e,group:g})));
    wrap.appendChild(Hdr("Revisar Treino",`${allEx.length} exercícios no total`,"window._wbStepBack('exercises')"));
    const cont=el("div"); cont.style.padding="20px";
    cont.innerHTML=`${Progress()}<div style="background:linear-gradient(135deg,#0f2744,#0e0e1a);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px"><div style="font-size:20px;font-weight:900;color:#fff;margin-bottom:4px">${wb.name}</div><div style="font-size:13px;color:var(--muted)">📅 ${wb.day||"Dia a definir"} · ${allEx.length} exercícios</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${wb.groups.map(g=>`<span class="tag" style="background:${EX[g].color}22;color:${EX[g].color}">${EX[g].icon} ${g}</span>`).join("")}</div></div>`;
    wb.groups.forEach(g=>{
      const exs=wb.selEx[g]||[]; if(!exs.length) return;
      const gcard=el("div","card"); gcard.style.cssText="border-radius:14px;margin-bottom:12px";
      gcard.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span style="font-size:18px">${EX[g].icon}</span><span style="font-weight:800;color:${EX[g].color};font-size:14px">${g}</span><span style="font-size:12px;color:var(--muted)">(${exs.length})</span></div>${exs.map(ex=>`<div style="padding:10px 12px;background:var(--bg);border-radius:10px;margin-bottom:6px"><div style="font-weight:700;color:#fff;font-size:13px;margin-bottom:4px">${ex.name}</div><div style="display:flex;gap:14px;font-size:12px;color:var(--muted)"><span>🔢 ${ex.sets}×${ex.reps}</span>${ex.load?`<span>⚖️ ${ex.load}kg</span>`:""}<span>⏱ ${ex.rest}s</span></div>${ex.obs?`<div style="font-size:11px;color:${ac()};margin-top:4px">📝 ${ex.obs}</div>`:""}</div>`).join("")}`;
      cont.appendChild(gcard);
    });
    cont.innerHTML+=`<div class="card" style="border-radius:14px;margin-bottom:16px"><div style="font-weight:800;color:#fff;font-size:14px;margin-bottom:10px">📝 Anotações Livres</div><textarea id="wb-notes" class="input" style="min-height:110px" placeholder="Notas da aula, progressão de cargas, orientações especiais...">${wb.notes||""}</textarea></div>`;
    const saveBtn=el("button","btn btn-green"); saveBtn.style.marginBottom="10px"; saveBtn.textContent=`✅ Salvar Treino`;
    saveBtn.onclick=window._wbSave;
    const cancelBtn=el("button","btn btn-ghost"); cancelBtn.textContent="Cancelar";
    cancelBtn.onclick=()=>nav("profile");
    cont.appendChild(saveBtn); cont.appendChild(cancelBtn);
    wrap.appendChild(cont);
  }

  // Workout builder actions
  window._wbBack=()=>nav("profile");
  window._wbStepBack=(step)=>{ STATE.workoutBuilder.step=step; render(); };
  window._wbSetDay=(d)=>{
    STATE.workoutBuilder.day=d;
    document.querySelectorAll(".chip[id^='day-']").forEach(b=>{b.classList.toggle("sel",b.id===`day-${d.replace("/","-")}`);});
  };
  window._wbNext=()=>{
    const n=document.getElementById("wb-name")?.value.trim();
    if(!n){ showToast("❌ Nome obrigatório!"); return; }
    STATE.workoutBuilder.name=n; STATE.workoutBuilder.step="groups"; render();
  };
  window._toggleGroup=(g)=>{
    const grps=STATE.workoutBuilder.groups;
    if (grps.includes(g)) STATE.workoutBuilder.groups=grps.filter(x=>x!==g);
    else STATE.workoutBuilder.groups.push(g);
    render();
  };
  window._wbGoExercises=()=>{
    if (!STATE.workoutBuilder.groups.length){ showToast("Selecione ao menos 1 grupo!"); return; }
    STATE.workoutBuilder.curGroup=STATE.workoutBuilder.groups[0];
    STATE.workoutBuilder.step="exercises"; render();
  };
  window._wbSetCurGroup=(g)=>{ STATE.workoutBuilder.curGroup=g; render(); };
  window._wbExBack=()=>{
    const gi=STATE.workoutBuilder.groups.indexOf(STATE.workoutBuilder.curGroup);
    if (gi===0) STATE.workoutBuilder.step="groups";
    else STATE.workoutBuilder.curGroup=STATE.workoutBuilder.groups[gi-1];
    render();
  };
  window._wbExNext=()=>{
    const gi=STATE.workoutBuilder.groups.indexOf(STATE.workoutBuilder.curGroup);
    if (gi===STATE.workoutBuilder.groups.length-1) { STATE.workoutBuilder.step="review"; render(); }
    else { STATE.workoutBuilder.curGroup=STATE.workoutBuilder.groups[gi+1]; render(); }
  };
  window._toggleEx=(g,name,remove)=>{
    const sel=STATE.workoutBuilder.selEx;
    if (!sel[g]) sel[g]=[];
    if (remove||sel[g].find(e=>e.name===name)) sel[g]=sel[g].filter(e=>e.name!==name);
    else sel[g].push({name,sets:3,reps:"12",load:"",rest:60,obs:""});
    render();
  };
  window._updateEx=(g,name,field,value)=>{
    const ex=STATE.workoutBuilder.selEx[g]?.find(e=>e.name===name);
    if (ex) ex[field]=value;
  };
  window._wbSave=async()=>{
    const notes=document.getElementById("wb-notes")?.value||"";
    const wb=STATE.workoutBuilder;
    const allEx=wb.groups.flatMap(g=>(wb.selEx[g]||[]).map(e=>({...e,group:g})));
    const workout={id:"w_"+Date.now(),name:wb.name,day:wb.day||"A definir",exercises:allEx,notes,createdAt:new Date().toLocaleDateString("pt-BR")};
    const s=STATE.students.find(x=>x.id===wb.studentId);
    if (!s.workouts) s.workouts=[];
    s.workouts.push(workout);
    await saveStudent(s);
    await loadStudents();
    STATE.currentStudent=STATE.students.find(x=>x.id===wb.studentId)||s;
    STATE.profileTab="treinos"; showToast("✅ Treino salvo!"); nav("profile");
  };

  return wrap;
}

/* ══════════════════════════════════════
   ACTIVE WORKOUT
══════════════════════════════════════ */
function renderActiveWorkout() {
  const aw=STATE.activeWorkout;
  if (!aw) { nav("profile"); return el("div"); }
  const exs=aw.exercises||[];
  const progress=(aw.done.length+aw.skipped.length)/exs.length;

  if (aw.finished) {
    const wrap=el("div"); wrap.style.cssText="min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center";
    wrap.innerHTML=`<div style="font-size:56px;margin-bottom:16px">🏆</div><div style="font-size:24px;font-weight:900;color:#fff;margin-bottom:6px">Treino Concluído!</div><div style="font-size:14px;color:var(--muted);margin-bottom:28px">${aw.done.length} feitos · ${aw.skipped.length} pulados</div>
    <div class="card" style="width:100%;max-width:320px;border-radius:18px;margin-bottom:20px">
      <div style="font-weight:800;color:#fff;font-size:15px;margin-bottom:12px">Atualizar cargas?</div>
      ${exs.filter((_,i)=>aw.done.includes(i)).map(e=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="flex:1;font-size:13px;color:#fff">${e.name}</span><input id="load-${e.name.replace(/\s/g,'_')}" type="number" placeholder="${e.load||'kg'}" style="width:60px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 8px;color:#fff;font-size:13px;font-family:'Outfit',sans-serif;outline:none;text-align:center"><span style="font-size:12px;color:var(--muted)">kg</span></div>`).join("")}
    </div>`;
    const finBtn=el("button","btn btn-primary"); finBtn.style.cssText="width:100%;max-width:320px;margin-bottom:10px"; finBtn.textContent="Salvar e Finalizar";
    finBtn.onclick=async()=>{
      // Update loads
      const s=STATE.currentStudent;
      const w=s.workouts?.find(x=>x.id===aw.id);
      if (w) { w.exercises.forEach(ex=>{ const inp=document.getElementById(`load-${ex.name.replace(/\s/g,'_')}`); if(inp&&inp.value) ex.load=inp.value; }); await saveStudent(s); await loadStudents(); STATE.currentStudent=STATE.students.find(x=>x.id===s.id)||s; }
      showToast("✅ Treino finalizado!"); STATE.profileTab="treinos"; nav("profile");
    };
    const skipBtn=el("button"); skipBtn.style.cssText="background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;font-family:'Outfit',sans-serif";
    skipBtn.textContent="Não atualizar"; skipBtn.onclick=()=>{ STATE.profileTab="treinos"; nav("profile"); };
    wrap.appendChild(finBtn); wrap.appendChild(skipBtn);
    return wrap;
  }

  const wrap=el("div","screen"); wrap.style.paddingBottom="20px";
  const hdr=el("div"); hdr.style.cssText="padding:52px 20px 16px;border-bottom:1px solid var(--border);background:var(--card)";
  hdr.innerHTML=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><button onclick="nav('profile')" style="width:36px;height:36px;border-radius:11px;background:var(--border);border:none;cursor:pointer;color:#fff;font-size:18px;flex-shrink:0">‹</button><div style="flex:1"><div style="font-weight:900;color:#fff;font-size:16px">${aw.name}</div><div style="font-size:12px;color:var(--muted)">Exercício ${(aw.done.length+aw.skipped.length)+1} de ${exs.length}</div></div><div style="font-size:14px;font-weight:800;color:${ac()}">${Math.round(progress*100)}%</div></div><div style="height:6px;border-radius:99px;background:var(--border);overflow:hidden"><div style="height:100%;width:${progress*100}%;background:${ac()};border-radius:99px;transition:width .4s"></div></div>`;
  wrap.appendChild(hdr);

  const cont=el("div"); cont.style.padding="20px";
  exs.forEach((e,i)=>{
    const isDone=aw.done.includes(i), isSkip=aw.skipped.includes(i), isCur=i===aw.currentIdx;
    const card=el("div"); card.style.cssText=`background:${isCur?ac()+"15":"var(--card)"};border:1.5px solid ${isDone?"#10B98133":isSkip?"var(--muted)33":isCur?ac():"var(--border)"};border-radius:16px;padding:16px;margin-bottom:10px;opacity:${isDone||isSkip?.55:1};cursor:${isDone||isSkip?"default":"pointer"}`;
    if (!isDone&&!isSkip) card.onclick=()=>{ aw.currentIdx=i; render(); };
    card.innerHTML=`<div style="display:flex;align-items:center;gap:12px"><div style="width:40px;height:40px;border-radius:12px;background:${isDone?"#10B98133":isSkip?"#2a2a3a":isCur?ac()+"33":"var(--border)"};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${isDone?"✅":isSkip?"⏭":EX[e.group]?.icon||"💪"}</div><div style="flex:1"><div style="font-weight:800;color:${isDone?"#10B981":isSkip?"var(--muted)":"#fff"};font-size:14px">${e.name}</div><div style="font-size:12px;color:var(--muted);margin-top:2px">${e.sets}×${e.reps}${e.load?" · "+e.load+"kg":""} · ${e.rest}s</div></div>${isCur&&!isDone&&!isSkip?`<div style="width:8px;height:8px;border-radius:50%;background:${ac()};box-shadow:0 0 8px ${ac()}"></div>`:""}</div>`;
    if (isCur&&!isDone&&!isSkip) {
      const btnRow=el("div"); btnRow.style.cssText="display:flex;gap:10px;margin-top:14px";
      const skipB=el("button"); skipB.style.cssText="flex:1;padding:12px;background:#2a2a3a;border:none;border-radius:12px;color:var(--soft);font-weight:700;font-size:14px;cursor:pointer;font-family:'Outfit',sans-serif"; skipB.textContent="⏭ PULAR";
      skipB.onclick=()=>{ aw.skipped.push(i); const next=exs.findIndex((_,j)=>j>i&&!aw.done.includes(j)&&!aw.skipped.includes(j)); if(next===-1){aw.finished=true;}else{aw.currentIdx=next;} render(); };
      const doneB=el("button"); doneB.style.cssText=`flex:2;padding:12px;background:#10B981;border:none;border-radius:12px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:'Outfit',sans-serif`; doneB.textContent="✔ FEITO";
      doneB.onclick=()=>{ aw.done.push(i); const next=exs.findIndex((_,j)=>j>i&&!aw.done.includes(j)&&!aw.skipped.includes(j)); if(next===-1){aw.finished=true;}else{aw.currentIdx=next;} render(); };
      btnRow.appendChild(skipB); btnRow.appendChild(doneB); card.appendChild(btnRow);
    }
    cont.appendChild(card);
  });
  if (aw.notes) { const nc=el("div","card"); nc.style.cssText=`border-radius:14px;margin-top:8px;border-left:3px solid ${ac()}`; nc.innerHTML=`<div style="font-size:11px;color:${ac()};font-weight:800;margin-bottom:6px;letter-spacing:.5px">ANOTAÇÕES</div><div style="font-size:13px;color:var(--soft);line-height:1.65;white-space:pre-wrap">${aw.notes}</div>`; cont.appendChild(nc); }
  wrap.appendChild(cont);
  return wrap;
}

function renderAI() {
  const wrap=el("div","screen"); wrap.style.cssText="min-height:100vh;background:var(--bg);padding-top:56px;display:flex;flex-direction:column";
  const hdr=el("div"); hdr.style.cssText="padding:14px 20px;border-bottom:1px solid var(--border);background:var(--card)";
  hdr.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div style="width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,${ac()},${ac()}99);display:flex;align-items:center;justify-content:center;font-size:18px">🤖</div><div><div style="font-weight:800;color:#fff;font-size:15px">IA Personal</div><div style="font-size:11px;color:#10B981;font-weight:600">● Online · ${AI_PROMPTS.length} tópicos</div></div></div>`;
  const stu=el("div"); stu.style.cssText="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none";
  const genBtn=el("button","chip sel"); genBtn.id="ai-btn-geral"; genBtn.textContent="Geral"; genBtn.onclick=()=>{ STATE.aiStudent=null; document.querySelectorAll("[id^='ai-btn-']").forEach(b=>{b.classList.remove("sel");b.style.borderColor="var(--border)";b.style.background="var(--card)";b.style.color="var(--muted)";}); genBtn.classList.add("sel"); genBtn.style.borderColor=ac(); genBtn.style.background=ac()+"22"; genBtn.style.color=ac(); };
  stu.appendChild(genBtn);
  STATE.students.forEach(s=>{ const b=el("button","chip"); b.id=`ai-btn-${s.id}`; b.textContent=s.name.split(" ")[0]; b.onclick=()=>{ STATE.aiStudent=s; document.querySelectorAll("[id^='ai-btn-']").forEach(x=>{x.classList.remove("sel");x.style.borderColor="var(--border)";x.style.background="var(--card)";x.style.color="var(--muted)";}); b.classList.add("sel"); b.style.borderColor=ac(); b.style.background=ac()+"22"; b.style.color=ac(); }; stu.appendChild(b); });
  hdr.appendChild(stu); wrap.appendChild(hdr);

  const msgs=el("div"); msgs.style.cssText="flex:1;overflow-y:auto;padding:14px 20px";
  function renderMsgs(){
    msgs.innerHTML="";
    STATE.aiMessages.forEach(m=>{
      const row=el("div"); row.style.cssText=`display:flex;justify-content:${m.role==="user"?"flex-end":"flex-start"};margin-bottom:14px`;
      if(m.role==="assistant"){ const av=el("div"); av.style.cssText=`width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,${ac()},${ac()}99);display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:8px;flex-shrink:0;margin-top:2px`; av.textContent="🤖"; row.appendChild(av); }
      const b=el("div"); b.style.cssText=`max-width:82%;background:${m.role==="user"?ac():"var(--card)"};border-radius:${m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px"};padding:12px 16px;border:${m.role==="user"?"none":"1px solid var(--border)"}`;
      b.innerHTML=`<div style="font-size:13px;color:#fff;line-height:1.65;white-space:pre-wrap">${m.content}</div>`;
      row.appendChild(b); msgs.appendChild(row);
    });
    if (STATE.aiLoading) {
      const row=el("div"); row.style.cssText="display:flex;margin-bottom:14px";
      row.innerHTML=`<div style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,${ac()},${ac()}99);display:flex;align-items:center;justify-content:center;font-size:14px;margin-right:8px;flex-shrink:0">🤖</div><div style="background:var(--card);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:14px 18px;display:flex;gap:6px;align-items:center"><div style="width:7px;height:7px;border-radius:50%;background:${ac()};animation:bounce .8s 0s infinite"></div><div style="width:7px;height:7px;border-radius:50%;background:${ac()};animation:bounce .8s .15s infinite"></div><div style="width:7px;height:7px;border-radius:50%;background:${ac()};animation:bounce .8s .3s infinite"></div></div>`;
      msgs.appendChild(row);
    }
    if (STATE.aiMessages.length===0) {
      const PPAGE=10; const total=Math.ceil(AI_PROMPTS.length/PPAGE);
      const pagDiv=el("div");
      pagDiv.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.5px">SUGESTÕES (${AI_PROMPTS.length} tópicos)</div><div style="display:flex;gap:6px;align-items:center"><button id="ai-prev" onclick="window._aiPage(false)" style="width:26px;height:26px;border-radius:8px;background:${STATE.aiPage>0?ac():"var(--border)"};border:none;cursor:pointer;color:#fff;font-size:14px">‹</button><span style="font-size:11px;color:var(--muted);padding:0 4px">${STATE.aiPage+1}/${total}</span><button id="ai-next" onclick="window._aiPage(true)" style="width:26px;height:26px;border-radius:8px;background:${STATE.aiPage<total-1?ac():"var(--border)"};border:none;cursor:pointer;color:#fff;font-size:14px">›</button></div></div>`;
      AI_PROMPTS.slice(STATE.aiPage*PPAGE,(STATE.aiPage+1)*PPAGE).forEach(p=>{
        const b=el("button"); b.style.cssText="display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--soft);font-size:13px;font-family:'Outfit',sans-serif;cursor:pointer;margin-bottom:7px";
        b.textContent=p; b.onclick=()=>{ document.getElementById("ai-input").value=p; };
        pagDiv.appendChild(b);
      });
      msgs.appendChild(pagDiv);
    }
    msgs.scrollTop=msgs.scrollHeight;
  }
  renderMsgs(); wrap.appendChild(msgs);

  const inputBar=el("div"); inputBar.style.cssText="padding:10px 16px 26px;border-top:1px solid var(--border);background:var(--card);display:flex;gap:10px";
  const inp=el("input","input"); inp.id="ai-input"; inp.placeholder="Perguntar sobre treinos..."; inp.style.cssText="flex:1;background:var(--bg)";
  const sendBtn=el("button"); sendBtn.style.cssText=`width:46px;height:46px;border-radius:12px;background:${ac()};border:none;cursor:pointer;font-size:18px;color:#fff;flex-shrink:0`;
  sendBtn.textContent="↑";
  async function aiSend(){
    const text=inp.value.trim(); if(!text||STATE.aiLoading) return;
    inp.value=""; const ctx=STATE.aiStudent?`Aluno: ${STATE.aiStudent.name}, ${STATE.aiStudent.age||""}anos, ${STATE.aiStudent.weight||""}kg, objetivo: ${STATE.aiStudent.goal||""}, saúde: ${STATE.aiStudent.healthHistory||""}`:""
    STATE.aiMessages.push({role:"user",content:text}); STATE.aiLoading=true; renderMsgs();
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:`Você é especialista em personal training, musculação, nutrição esportiva e reabilitação. Responda em português brasileiro. Seja prático e didático. ${ctx}`,messages:STATE.aiMessages.map(m=>({role:m.role,content:m.content}))})});
      const data=await res.json();
      STATE.aiMessages.push({role:"assistant",content:data.content?.[0]?.text||"Não consegui responder."});
    }catch{ STATE.aiMessages.push({role:"assistant",content:"Erro de conexão. Tente novamente."}); }
    STATE.aiLoading=false; renderMsgs();
  }
  sendBtn.onclick=aiSend; inp.onkeydown=e=>e.key==="Enter"&&aiSend();
  inputBar.appendChild(inp); inputBar.appendChild(sendBtn); wrap.appendChild(inputBar);

  window._aiPage=(next)=>{ const total=Math.ceil(AI_PROMPTS.length/10); STATE.aiPage=next?Math.min(total-1,STATE.aiPage+1):Math.max(0,STATE.aiPage-1); renderMsgs(); };
  wrap.appendChild(renderNavBottom("ai"));
  return wrap;
}

/* ══════════════════════════════════════

══════════════════════════════════════ */
function renderExercises() {
  const wrap=el("div","screen"); wrap.style.paddingTop="56px";
  const total=Object.values(EX).reduce((a,g)=>a+g.list.length,0);
  const cont=el("div"); cont.style.padding="18px 20px 0";
  cont.innerHTML=`<div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:4px">Biblioteca</div><div style="font-size:13px;color:var(--muted);margin-bottom:14px">${total} exercícios em ${Object.keys(EX).length} grupos</div><div style="position:relative;margin-bottom:14px"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)">🔍</span><input id="ex-search" class="input" placeholder="Buscar exercício..." style="padding-left:40px"></div><div id="ex-list"></div>`;
  wrap.appendChild(cont);
  let openGroup=null;
  function renderExList(q=""){
    const list=cont.querySelector("#ex-list"); list.innerHTML="";
    Object.entries(EX).forEach(([group,db])=>{
      const filtered=db.list.filter(e=>e.toLowerCase().includes(q.toLowerCase()));
      if(q&&!filtered.length) return;
      const isOpen=q.length>0||openGroup===group;
      const grpDiv=el("div"); grpDiv.style.marginBottom="10px";
      const hd=el("div"); hd.style.cssText=`background:var(--card);border:1px solid ${isOpen?db.color:"var(--border)"};border-radius:${isOpen?"14px 14px 0 0":"14px"};padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px`;
      hd.innerHTML=`<div style="width:40px;height:40px;border-radius:12px;background:${db.color}22;display:flex;align-items:center;justify-content:center;font-size:20px">${db.icon}</div><div style="flex:1"><div style="font-weight:800;color:#fff;font-size:15px">${group}</div><div style="font-size:12px;color:var(--muted);margin-top:2px">${filtered.length} exercícios</div></div><div style="color:var(--muted);font-size:18px;transform:${isOpen?"rotate(90deg)":"none"};transition:transform .2s">›</div>`;
      hd.onclick=()=>{ openGroup=isOpen&&!q?null:group; renderExList(q); };
      grpDiv.appendChild(hd);
      if(isOpen){
        const body=el("div"); body.style.cssText=`background:var(--card);border-radius:0 0 14px 14px;border:1px solid ${db.color};border-top:none;padding:8px 14px 14px`;
        filtered.forEach((ex,i)=>{ const row=el("div"); row.style.cssText=`display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:${i<filtered.length-1?"1px solid var(--border)":"none"}`; row.innerHTML=`<div style="width:24px;height:24px;border-radius:6px;background:${db.color}22;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">${db.icon}</div><div style="flex:1;font-size:13px;color:#ddd;font-weight:500">${ex}</div>`; body.appendChild(row); });
        grpDiv.appendChild(body);
      }
      list.appendChild(grpDiv);
    });
  }
  renderExList();
  setTimeout(()=>{ const inp=cont.querySelector("#ex-search"); if(inp) inp.oninput=e=>renderExList(e.target.value); },100);
  wrap.appendChild(renderNavBottom("exercises"));
  return wrap;
}

      cont.innerHTML=`<div style="font-size:13px;color:var(--muted);margin-bottom:4px">Bem-vindo,</div><div style="font-size:26px;font-weight:900;color:#fff;margin-bottom:20px">${s.name.split(" ")[0]} 👊</div>`;
      if (todayW) {
        const tcard=el("div"); tcard.style.cssText=`background:linear-gradient(135deg,${ac()}22,#0e0e1a);border-radius:20px;padding:20px;border:1px solid ${ac()}44;margin-bottom:16px`;
        tcard.innerHTML=`<div style="font-size:11px;color:${ac()};font-weight:800;margin-bottom:8px;letter-spacing:.5px">TREINO DE HOJE</div><div style="font-size:20px;font-weight:900;color:#fff;margin-bottom:4px">${todayW.name}</div><div style="font-size:13px;color:var(--muted);margin-bottom:16px">${todayW.exercises?.length||0} exercícios · ${todayW.day}</div>`;
        const startBtn=el("button"); startBtn.style.cssText=`background:${ac()};border:none;border-radius:12px;padding:13px 28px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:8px`;
        startBtn.innerHTML="▶ INICIAR TREINO"; startBtn.onclick=()=>{ STATE.activeWorkout={...todayW,currentIdx:0,done:[],skipped:[]}; nav("activeWorkout"); };
        tcard.appendChild(startBtn); cont.appendChild(tcard);
      } else {
        cont.innerHTML+=`<div class="card" style="border-radius:20px;text-align:center;padding:20px;margin-bottom:16px"><div style="font-size:36px;margin-bottom:8px">🎉</div><div style="font-weight:800;color:#fff">Dia de descanso!</div></div>`;
      }
      const grid=el("div"); grid.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px";
      grid.innerHTML=`<div class="card" style="border-radius:16px"><div style="font-size:26px;font-weight:900;color:#10B981">${s.frequency||0}%</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Frequência</div><div style="margin-top:8px">${bar(s.frequency||0,100,"#10B981",4).outerHTML}</div></div><div class="card" style="border-radius:16px"><div style="font-size:26px;font-weight:900;color:${ac()}">${s.weight||"—"}</div><div style="font-size:12px;color:var(--muted);margin-top:4px">Peso (kg)</div></div>`;
      cont.appendChild(grid);
    } else if (stuTab==="workout") {
      cont.innerHTML=`<div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:16px">Meus Treinos</div>`;
      if (!s.workouts?.length) cont.innerHTML+=`<div style="text-align:center;padding:40px 0;color:var(--muted)">Nenhum treino cadastrado</div>`;
      (s.workouts||[]).forEach(w=>{
        const wcard=el("div","card"); wcard.style.cssText="border-radius:18px;padding:16px;margin-bottom:12px";
        wcard.innerHTML=`<div style="font-weight:800;color:#fff;font-size:16px;margin-bottom:2px">${w.name}</div><div style="font-size:12px;color:var(--muted);margin-bottom:12px">📅 ${w.day} · ${w.exercises?.length||0} exercícios</div>`;
        (w.exercises||[]).forEach(ex=>{ const row=el("div"); row.style.cssText="display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:10px;margin-bottom:6px"; row.innerHTML=`<div style="width:28px;height:28px;border-radius:8px;background:${ac()}33;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${EX[ex.group]?.icon||"💪"}</div><div style="flex:1"><div style="font-weight:700;color:#fff;font-size:13px">${ex.name}</div><div style="font-size:11px;color:var(--muted)">${ex.sets}×${ex.reps}${ex.load?" · "+ex.load+"kg":""}</div></div>`; wcard.appendChild(row); });
        if(w.notes) wcard.innerHTML+=`<div style="margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;border-left:3px solid ${ac()}"><div style="font-size:11px;color:${ac()};font-weight:800;margin-bottom:4px">ANOTAÇÕES</div><div style="font-size:12px;color:var(--soft);line-height:1.6;white-space:pre-wrap">${w.notes}</div></div>`;
        const sb=el("button"); sb.style.cssText=`width:100%;margin-top:12px;padding:13px;background:${ac()};border:none;border-radius:12px;color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:'Outfit',sans-serif`;
        sb.innerHTML="▶ INICIAR TREINO"; sb.onclick=()=>{ STATE.activeWorkout={...w,currentIdx:0,done:[],skipped:[]}; nav("activeWorkout"); };
        wcard.appendChild(sb); cont.appendChild(wcard);
      });
    } else if (stuTab==="progress") {
      const hist=s.weightHistory||[];
      cont.innerHTML=`<div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:16px">Minha Evolução</div><div class="card" style="border-radius:16px;margin-bottom:12px"><div style="font-weight:800;color:#fff;margin-bottom:14px">Evolução de Peso</div><canvas id="stu-chart" style="width:100%;height:100px"></canvas>${!hist.length?`<div style="text-align:center;color:var(--muted);font-size:13px;padding:20px 0">Nenhum registro</div>`:""}</div>`;
      if (hist.length>=2) setTimeout(()=>{ const canvas=document.getElementById("stu-chart"); if(!canvas) return; const ctx2=canvas.getContext("2d"); canvas.width=canvas.offsetWidth*2; canvas.height=200; ctx2.scale(2,2); const W=canvas.offsetWidth/2,H=100; const vals=hist.map(d=>d.value),mn=Math.min(...vals)-1,mx=Math.max(...vals)+1; const pts=hist.map((d,i)=>({x:(i/(hist.length-1))*W,y:H-((d.value-mn)/(mx-mn))*H})); ctx2.fillStyle="#13131c"; ctx2.fillRect(0,0,W,H); const color=ac(); ctx2.beginPath(); ctx2.moveTo(pts[0].x,pts[0].y); pts.forEach(p=>ctx2.lineTo(p.x,p.y)); ctx2.lineTo(W,H); ctx2.lineTo(0,H); ctx2.closePath(); ctx2.fillStyle=color+"33"; ctx2.fill(); ctx2.beginPath(); ctx2.moveTo(pts[0].x,pts[0].y); pts.forEach(p=>ctx2.lineTo(p.x,p.y)); ctx2.strokeStyle=color; ctx2.lineWidth=2.5; ctx2.lineJoin="round"; ctx2.lineCap="round"; ctx2.stroke(); pts.forEach(p=>{ ctx2.beginPath(); ctx2.arc(p.x,p.y,4,0,Math.PI*2); ctx2.fillStyle=color; ctx2.fill(); ctx2.strokeStyle="#13131c"; ctx2.lineWidth=2; ctx2.stroke(); }); },100);
    } else if (stuTab==="chat") {
      cont.innerHTML=`<div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:16px">Chat com Personal</div>`;
      renderChatTab(cont);
    }
    wrap.appendChild(cont);

    const navB=el("div","nav-bottom");
    nav2.forEach(n=>{ const b=el("button",`nav-btn${stuTab===n.id?" active":""}`); if(stuTab===n.id) b.style.color=ac(); b.innerHTML=`<span style="font-size:20px">${n.icons}</span><span style="font-size:10px;font-weight:700">${n.label}</span>${stuTab===n.id?'<div class="nav-dot"></div>':""}`;b.onclick=()=>{STATE.stuTab=n.id;render2();}; navB.appendChild(b); });
    wrap.appendChild(navB);
  }

  render2();
  return wrap;
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
async function init() {
  await loadSettings();
  await loadStudents();
  await loadAdminNotes();
  document.getElementById("loading").remove();
  render();
}

init();
</script>
